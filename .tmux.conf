# Progressive test 8: Fix italic text colors

set-option -g mouse on
set-option -g history-limit 10000
set-option -g status-interval 5

set-option -g status-style "bg=black,fg=white"
set-option -g status-left-length 80
set-option -g status-right-length 40

set-option -g status-left "#[bg=blue,fg=white,bold] TX #[bg=black,fg=cyan] #(cat .ai/tx/status.txt 2>/dev/null || echo 'INIT') #[fg=brightblack]│#[fg=white,nobold] "
set-option -g status-right "#{pane_title} #[fg=brightblack]│#[fg=white] %H:%M "

set-option -g window-status-format " #I "
set-option -g window-status-current-format "#[bg=blue,fg=white,bold] #I #[bg=black,fg=white,nobold]"

set-option -g pane-border-style "fg=brightblack"
set-option -g pane-active-border-style "fg=blue"

set-option -g message-style "bg=blue,fg=white"
set-option -g message-command-style "bg=black,fg=white"
