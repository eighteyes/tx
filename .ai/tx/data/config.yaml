# Runtime defaults
inbox: inject                   # Message delivery: inject (tmux), hook (on user input), ask (manual)

# Guardrails - unified runtime enforcement
# See docs/guardrails.md for full reference
# Mode: strict (block/kill) + warning (inject feedback)
# Override chain: mesh-local agent > mesh-local mesh > global agent > global mesh > here > hardcoded
guardrails:
  bash_guard:
    strict: true                # Block workDir escapes — primary security boundary
    warning: true               # Include reason in block message
    kill_threshold: 3           # Violations before worker kill
  identity_gate:
    strict: false               # Warn on identity mismatch
    warning: true
    kill_threshold: null        # null = block only, no kill
  write_gate:
    strict: false               # Warn on path violations
    warning: true
    kill_threshold: null
  read_gate:
    strict: false               # Warn on path violations
    warning: true
    kill_threshold: null
  routing_error:
    strict: false               # Warn on routing failures
    warning: true
    max_retries: 3              # Attempts before escalating to human
    routing_retry_max: null     # Max messages per edge per turn (null = no limit)
    routing_fallback: null      # Fallback agent when edge limit hit
  max_messages:
    strict: true                # Kill runaway agents at message limit
    warning: true
    limit: null                 # Per-agent message cap (null = no limit)
  max_turns:
    strict: false               # Warn at threshold (SDK handles hard limit)
    warning: true
    limit: null                 # Per-agent turn cap (null = no limit)
  max_mesh_messages:
    strict: true                # Kill runaway meshes at message limit
    warning: true
    limit: null                 # Mesh-wide message cap (null = no limit)
  max_instances:
    strict: false
    warning: true
    limit: null                 # Parallel instance cap per mesh (null = unlimited)
  duplicate_target:
    strict: false               # Warn on duplicate routing
    warning: true

  # Per-mesh and per-agent overrides
  # meshes:
  #   narrative-engine:
