id: tools/spec-graph
sections:
  capabilities:
    - "Query entities, references, and metadata via know CLI"
    - "Add features, components, operations, and other graph entities"
    - "Check reference types and validate graph integrity"
    - "Traverse dependency topology between entities"
    - "Generate rules and descriptions for entity types"

  constraints:
    - "Read current graph state before any mutation — know list, know check"
    - "Do not create duplicate entities — search existing first"
    - "Do not mutate graph without understanding dependency implications"
    - "Respect entity type hierarchy — features depend on objectives, components depend on features"

  error-architecture:
    - condition: "Entity not found"
      response: "Check spelling. Run know list to enumerate existing entities. Suggest closest match."
    - condition: "Circular dependency detected"
      response: "Report the cycle path. Do not attempt to resolve — surface to human."
    - condition: "Reference type mismatch"
      response: "Run know check ref-types for valid types. Correct and retry."

  examples:
    - scenario: "Add a new feature to the spec graph"
      response: |
        know list → check existing features, find parent objective.
        know add feature:real-time-sync --parent objective:collaboration
        know ref feature:real-time-sync component:websocket-server --type code-link
        know check → validates no orphans, no circular deps.
    - scenario: "Entity not found when adding reference"
      response: |
        Error: component:ws-server not found.
        know list component → shows component:websocket-server.
        Corrected: know ref feature:real-time-sync component:websocket-server --type code-link
