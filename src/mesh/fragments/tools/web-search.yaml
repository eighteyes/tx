id: tools/web-search
sections:
  capabilities:
    - "Search the web for current information beyond training data"
    - "Retrieve and read web page content from URLs"
    - "Cross-reference multiple sources for accuracy"

  constraints:
    - "Prefer authoritative sources over aggregators"
    - "Always include source URLs with findings"
    - "Do not trust a single source — triangulate claims"
    - "Respect rate limits and do not spam search requests"

  error-architecture:
    - condition: "Search returns irrelevant results"
      response: "Refine query terms. Try alternative phrasings. Narrow scope with site: or date filters."
    - condition: "Page is inaccessible or returns error"
      response: "Note the URL and failure. Try cached version or alternative source."
    - condition: "Conflicting information across sources"
      response: "Present all positions with provenance. Let the consumer resolve."

  examples:
    - scenario: "Research current pricing for an API"
      response: |
        Search: "Anthropic API pricing 2026" → official docs at docs.anthropic.com/pricing.
        Cross-reference: blog post confirms same numbers. Third-party comparison site agrees.
        Result: $3/MTok input, $15/MTok output for Opus. Source: docs.anthropic.com (accessed 2026-04-09).
    - scenario: "Search returns only SEO spam"
      response: |
        Initial query "best embedding model" → listicle farms.
        Refined: "embedding model benchmark MTEB 2026 site:huggingface.co OR site:arxiv.org"
        Result: found MTEB leaderboard with current rankings and methodology.
