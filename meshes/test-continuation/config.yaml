# test-continuation/config.yaml
# E2E Test Mesh - Validates session continuation
#
# Purpose:
# - Prove first task stores sessionId in SQLite
# - Prove second task retrieves same sessionId
# - Prove conversation context is preserved (worker remembers task 1)

mesh: test-continuation
description: "Session continuation test mesh - validates sessions persist across tasks"

agents:
  - name: worker
    model: haiku
    prompt: worker.md

entry_point: worker
completion_agent: worker

# Enable continuation - sessions persist between tasks
continuation: true
