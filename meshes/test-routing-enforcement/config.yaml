# test-routing-enforcement/config.yaml
# E2E Test Mesh - Validates routing rules are enforced
#
# Purpose:
# - Prove valid routed messages are delivered
# - Prove invalid routed messages are rejected with feedback
# - Prove second violation escalates
# - Prove FSM validation rejects before queue insertion

mesh: test-routing-enforcement
description: "Routing enforcement test mesh - validates routing table rules"

agents:
  - name: coordinator
    model: haiku
    prompt: coordinator.md
    # Central coordinator - routes tasks to specialists

  - name: specialist-a
    model: haiku
    prompt: specialist-a.md
    # Specialist A - handles type A tasks

  - name: specialist-b
    model: haiku
    prompt: specialist-b.md
    # Specialist B - handles type B tasks

entry_point: coordinator
completion_agent: coordinator

# Routing table - defines valid message flows
routing:
  coordinator:
    # Coordinator can ask either specialist
    ask:
      specialist-a: "Request type A work"
      specialist-b: "Request type B work"
    # Coordinator can respond to asks
    ask-response: {}
    # Coordinator sends completion to core
    complete:
      core: "Work done"

  specialist-a:
    # Specialist A can only respond to coordinator
    ask-response:
      coordinator: "Response from A"
    # CANNOT communicate with specialist-b directly

  specialist-b:
    # Specialist B can only respond to coordinator
    ask-response:
      coordinator: "Response from B"
    # CANNOT communicate with specialist-a directly
