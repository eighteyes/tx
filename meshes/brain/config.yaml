mesh: brain
description: "Knowledge gateway agent - mediates all spec-graph access"
intents:
  patterns:
    # Feature creation
    - add feature
    - create feature
    - new feature
    # Bug tracking
    - bug
    - issue
    - problem
    - broken
    # Planning
    - plan
    - design
    - architect
    - spec out
    # Implementation (routes to validate first)
    - build
    - implement
    - code up
    - develop
    - refactor
    - improve
    - optimize
    # Codebase research (brain answers directly)
    - how does
    - where is
    - what does
    - explain
    - find
    - show me
    - understand
    - trace
    - why does
    - what's the
  commands:
    # Features
    "add feature": "/know:add"
    "create feature": "/know:add"
    "new feature": "/know:add"
    # Bugs
    bug: "/know:bug"
    issue: "/know:bug"
    problem: "/know:bug"
    # Planning
    plan: "/know:plan"
    design: "/know:plan"
    architect: "/know:plan"
    "spec out": "/know:plan"
    # Implementation: /know:build owned by dev-review mesh
agents:
  - name: brain
    model: opus
    prompt: prompt.md
entry_point: brain
workspace:
  path: ".ai/tx/output/brain/"
capability:
  domain:
    - knowledge
  input:
    - question
    - feature-request
    - bug-report
  output:
    - knowledge-update
    - plan
  tools:
    - spec-graph
  interaction:
    - none
