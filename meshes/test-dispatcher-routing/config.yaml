# test-dispatcher-routing
# E2E test mesh for dispatcher routing mode
# Tests: linear flow, branch with outcome, terminal agent, escalation, FSM compat

mesh: test-dispatcher-routing
description: Test mesh for dispatcher routing mode

routing_mode: dispatcher

agents:
  - name: entry
    model: haiku
    prompt: entry.md
  - name: reviewer
    model: haiku
    prompt: reviewer.md
  - name: writer
    model: haiku
    prompt: writer.md
  - name: editor
    model: haiku
    prompt: editor.md
  - name: finalizer
    model: haiku
    prompt: finalizer.md

entry_point: entry
boundary_agents:
  - finalizer

routing:
  entry: reviewer                    # linear → always routes to reviewer
  reviewer:                          # branch → outcome determines target
    approved: writer
    needs_work: editor
    default: writer
  editor: reviewer                   # linear → back to reviewer after edits
  writer: finalizer                  # linear → to finalizer
  # finalizer: (absent) = terminal agent → routes to core/core on complete

fsm:
  initial: review
  states:
    review:
      agents: [entry, reviewer, editor]
      exit:
        default: write
    write:
      agents: [writer]
      exit:
        default: finalize
    finalize:
      agents: [finalizer]
      exit: {}
  scripts: {}
