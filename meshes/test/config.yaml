mesh: test
description: "Test mesh for validating HITL flow and topology patterns"

agents:
  - name: worker
    model: haiku
    prompt: prompt.md

  - name: asker
    model: haiku
    prompt: asker/prompt.md

  - name: looper
    model: haiku
    prompt: looper/prompt.md

  - name: writer
    model: haiku
    prompt: writer/prompt.md

entry_point: worker

routing:
  worker:
    complete:
      core: "Worker completed"
    blocked:
      core: "Worker blocked"
  asker:
    complete:
      core: "Asker completed"
    blocked:
      core: "Asker blocked"
  looper:
    complete:
      core: "Looper completed"
    blocked:
      core: "Looper blocked"
  writer:
    complete:
      core: "Writer completed"
    blocked:
      core: "Writer blocked"
