# Test mesh for routing-parallelism feature
# Verifies: parallelism blocks, fork/join semantics, exit gating

mesh: test-parallelism
description: "Test mesh for parallel execution - fork from entry, join at exit"

agents:
  - name: preload
    model: haiku
    prompt: preload.md
    load:
      - "package.json"
    # checkpoint: true is auto-added by parallelism config

  - name: analyst
    model: sonnet
    prompt: parallel-worker.md
    # fork_from: preload is auto-added by parallelism config

  - name: reviewer
    model: sonnet
    prompt: parallel-worker.md

  - name: critic
    model: sonnet
    prompt: parallel-worker.md

  - name: synthesizer
    model: sonnet
    prompt: synthesizer.md

entry_point: preload

parallelism:
  - agents: [analyst, reviewer, critic]
    entry: preload
    exit: synthesizer
    on_partial: continue

routing:
  preload:
    complete:
      analyst: "Ready for parallel analysis"
  analyst:
    complete:
      synthesizer: "Analysis complete"
  reviewer:
    complete:
      synthesizer: "Review complete"
  critic:
    complete:
      synthesizer: "Critique complete"
  synthesizer:
    complete:
      core: "All parallel work synthesized"
