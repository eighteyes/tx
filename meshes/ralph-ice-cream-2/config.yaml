mesh: ralph-ice-cream-2

description: |
  Layered quality refinement pipeline: haiku drafts (quick, honest), sonnet reviews
  (add value only), opus finalizes (ships with confidence).

  Aligns with Ralph playbook: context efficiency, self-correction, deterministic FSM,
  autonomous operation with iteration awareness.

# ============================================================================
# AGENT CONFIGURATION
# ============================================================================

agents:
  - name: ralph-haiku
    model: haiku
    prompt: ralph-haiku/prompt.md
    description: |
      Fast drafting agent. Creates solid first-draft response addressing all task
      requirements. Self-assesses via decision tree (accuracy, completeness, clarity).
      Routes via success_signal: PASS→sonnet, REFINE→self, BLOCKED→error.

  - name: sonnet-reviewer
    model: sonnet
    prompt: sonnet-reviewer/prompt.md
    description: |
      Quality review agent. Reviews haiku draft against 4 gates (accuracy, completeness,
      clarity, structure). Routes based on value-add: PASS→opus, REFINE→self, BLOCKED→error.

  - name: opus-reviewer
    model: opus
    prompt: opus-reviewer/prompt.md
    description: |
      Final quality gate. Makes final judgment on readiness for delivery.
      Applies final polish if needed (max 1 refinement). Routes to core.

# ============================================================================
# MESH ENTRY & EXIT
# ============================================================================

entry_point: ralph-haiku
completion_agent: opus-reviewer

# ============================================================================
# MESSAGE ROUTING
# ============================================================================

routing:
  ralph-haiku:
    complete:
      sonnet-reviewer: "Quality threshold met, ready for sonnet review"
      ralph-haiku: "Below threshold, refining draft"
    blocked:
      core: "Fatal error - cannot proceed"

  sonnet-reviewer:
    complete:
      opus-reviewer: "Review complete, ready for opus final review"
      sonnet-reviewer: "Needs refinement, reviewing again"
    blocked:
      core: "Fatal error - cannot proceed"

  opus-reviewer:
    complete:
      core: "Final review complete - approved for delivery"
      opus-reviewer: "Final polish needed"
    blocked:
      core: "Fatal error - cannot proceed"

# ============================================================================
# WORKSPACE STRUCTURE
# ============================================================================

workspace:
  path: ".ai/ralph/{topic}/"
  structure:
    # Agents should load context from workspace files
    - specs/: Optional topical specifications
    - AGENTS.md: This mesh's operational guide
    - PLAN.md: Optional implementation plan
  note: |
    Deterministic operation: Each FSM iteration loads identical workspace context.
    Agents should reference {workspace}/AGENTS.md for operational guidance.

# ============================================================================
# REARMATTER CONFIGURATION
# ============================================================================

rearmatter:
  enabled: true
  fields:
    - success_signal
    - analysis
    - iteration_notes
  thresholds:
    confidence: 0.7

# ============================================================================
# FSM: FINITE STATE MACHINE
# ============================================================================

fsm:
  initial: ralph_haiku_loop

  context:
    haiku_iteration: 0
    sonnet_iteration: 0
    opus_iteration: 0
    max_haiku_iterations: 5
    max_sonnet_iterations: 3
    max_opus_iterations: 2

  states:
    # ============================================================
    # DRAFTING LOOP: Ralph Haiku
    # ============================================================
    ralph_haiku_loop:
      agents: [ralph-haiku]
      entry:
        set:
          haiku_iteration: "$((haiku_iteration + 1))"
      exit:
        gates:
          ralph-haiku:
            - check_haiku_max_iterations
        set:
          haiku_success_signal: "$(echo '$rearmatter' | yq '.success_signal')"
        when:
          - condition: haiku_success_signal == "PASS"
            target: sonnet_review_loop
          - condition: haiku_success_signal == "REFINE"
            target: ralph_haiku_loop
          - condition: haiku_success_signal == "BLOCKED"
            target: blocked_state
        default: ralph_haiku_loop

    # ============================================================
    # REVIEW LOOP: Sonnet Reviewer
    # ============================================================
    sonnet_review_loop:
      agents: [sonnet-reviewer]
      entry:
        set:
          sonnet_iteration: "$((sonnet_iteration + 1))"
      exit:
        gates:
          sonnet-reviewer:
            - check_sonnet_max_iterations
        set:
          sonnet_success_signal: "$(echo '$rearmatter' | yq '.success_signal')"
        when:
          - condition: sonnet_success_signal == "PASS"
            target: opus_review_loop
          - condition: sonnet_success_signal == "REFINE"
            target: sonnet_review_loop
          - condition: sonnet_success_signal == "BLOCKED"
            target: blocked_state
        default: sonnet_review_loop

    # ============================================================
    # FINAL LOOP: Opus Reviewer
    # ============================================================
    opus_review_loop:
      agents: [opus-reviewer]
      entry:
        set:
          opus_iteration: "$((opus_iteration + 1))"
      exit:
        gates:
          opus-reviewer:
            - check_opus_max_iterations
        set:
          opus_success_signal: "$(echo '$rearmatter' | yq '.success_signal')"
        when:
          - condition: opus_success_signal == "PASS"
            target: complete
          - condition: opus_success_signal == "REFINE"
            target: opus_review_loop
          - condition: opus_success_signal == "BLOCKED"
            target: blocked_state
        default: opus_review_loop

    # ============================================================
    # ERROR HANDLING
    # ============================================================
    blocked_state:
      agents: [core]
      exit:
        default: error_state

    error_state:
      agents: [core]

    complete:
      agents: [core]

  # ========================================================================
  # FSM VALIDATION SCRIPTS
  # ========================================================================
  scripts:
    check_haiku_max_iterations: |
      [[ $haiku_iteration -le $max_haiku_iterations ]] || {
        echo "Haiku max iterations ($max_haiku_iterations) reached" >&2
        exit 1
      }

    check_sonnet_max_iterations: |
      [[ $sonnet_iteration -le $max_sonnet_iterations ]] || {
        echo "Sonnet max iterations ($max_sonnet_iterations) reached" >&2
        exit 1
      }

    check_opus_max_iterations: |
      [[ $opus_iteration -le $max_opus_iterations ]] || {
        echo "Opus max iterations ($max_opus_iterations) reached" >&2
        exit 1
      }

# ============================================================================
# PLAYBOOK ALIGNMENT
# ============================================================================
playbook_notes: |
  Ralph Playbook Implementation:

  Context Efficiency:
  - Prompts compressed from ~250 lines to ~40 lines (84% reduction)
  - Markdown-first, token-aware guidance
  - Decision trees replace narrative instruction

  Autonomous Operation:
  - Agents control routing via success_signal
  - Iteration awareness built into prompts
  - Clear "when to PASS" guidance prevents endless loops

  Backpressure:
  - Iteration limits enforce finite loops
  - Quality gates (accuracy, completeness, clarity, structure) provide objective criteria
  - Agent routing based on value-add, not just iteration count

  Deterministic FSM:
  - Workspace context loading pattern enabled
  - Frontmatter-based state signals (rearmatter + success_signal)
  - Identical context per iteration ensures reproducibility

  Self-Correction:
  - Each layer assesses own work before routing
  - Late-loop PASS guidance prevents spinning
  - Subagent pattern documented (optional spawning for expensive work)

  Topic Scope:
  - Workspace supports single-concern focus
  - Agents instructed to complete work, not over-scope

