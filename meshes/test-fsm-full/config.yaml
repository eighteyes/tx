# test-fsm-full/config.yaml
# FSM Feature Test Harness
# 11 states, 12 agents — exercises every FSM runtime capability

mesh: test-fsm-full
description: "FSM feature test harness. Covers: branching, gates, ensemble, loops, HITL, scripts, arithmetic, entry_gates, onEnter/onExit, exit.run."

agents:
  - name: entry
    model: haiku
    prompt: entry/prompt.md
    # Reads test config, FSM routes by mode

  - name: step-a
    model: haiku
    prompt: steps/step-a.md
    # Linear pipeline — writes step-a.yaml

  - name: step-b
    model: haiku
    prompt: steps/step-b.md
    # Linear pipeline — writes step-b.yaml

  - name: step-c
    model: haiku
    prompt: steps/step-c.md
    # Linear pipeline — writes step-c.yaml

  - name: hitl-agent
    model: haiku
    prompt: hitl/prompt.md
    # HITL self-loop — messages core, writes hitl-complete.yaml

  - name: worker-1
    model: haiku
    prompt: workers/worker-1.md
    # Ensemble participant — writes worker-1.yaml

  - name: worker-2
    model: haiku
    prompt: workers/worker-2.md
    # Ensemble participant — writes worker-2.yaml

  - name: worker-3
    model: haiku
    prompt: workers/worker-3.md
    # Ensemble participant (fragile) — writes worker-3.yaml

  - name: judge
    model: haiku
    prompt: judge/prompt.md
    # Verdict agent — writes verdict.yaml {result: pass|retry}

  - name: retrier
    model: haiku
    prompt: loops/retrier.md
    # Retry gate — writes retry-ready.yaml

  - name: looper
    model: haiku
    prompt: loops/looper.md
    # Iteration loop — writes loop-result.yaml

  - name: finalizer
    model: haiku
    prompt: final/prompt.md
    # Terminal prep — writes summary.yaml

entry_point: entry

completion_agents:
  - finalizer

# ==========================================
# FSM — Full Feature Coverage
# ==========================================
#
# Features tested per state:
#   entry         → exit.set (bash/yq), exit.when (==), exit.default
#   step_a        → onEnter script, exit.gates (file), exit.default
#   step_b        → entry_gates, onExit script, exit.gates (file)
#   step_c        → exit.gates (file), exit.run (script-based routing)
#   hitl_gate     → HITL self-loop, exit.gates (file), exit.default only
#   fan_out       → ensemble (parallel, concat, timeout, fault_tolerance)
#   verdict_check → exit.gates (file), exit.set (yq), exit.when (==)
#   retry         → entry.set (arithmetic), exit.gates (script + file), exit.when (==)
#   counter_loop  → entry.set (arithmetic), exit.set (bash), exit.when (!=), self-loop
#   finalize      → exit.gates (file), exit.default
#   complete      → terminal: true

fsm:
  initial: entry

  context:
    mode: "full"
    workspace: null
    iteration: 0
    max_iterations: 3
    retry_count: 0
    max_retries: 2
    result: null
    loop_done: "false"
    retries_exhausted: "false"
    ensemble_output: null

  scripts:
    check_max_retries: |
      [[ $retry_count -le $max_retries ]]
    log_state_entry: |
      echo "entered=$FSM_STATE at=$(date +%s)"
    log_state_exit: |
      echo "exited=$FSM_STATE at=$(date +%s)"

  states:
    # ------------------------------------------
    # ENTRY — exit.set, exit.when (==), exit.default
    # ------------------------------------------

    entry:
      agents: [entry]
      exit:
        set:
          mode: "$(yq '.mode // \"full\"' .ai/tx/test-fsm-full/test-config.yaml 2>/dev/null || echo full)"
          workspace: ".ai/test-fsm-full/workspace"
        when:
          - condition: mode == "linear"
            target: step_a
          - condition: mode == "hitl"
            target: hitl_gate
          - condition: mode == "ensemble"
            target: fan_out
        default: step_a

    # ------------------------------------------
    # LINEAR PIPELINE — file gates, onEnter, onExit, entry_gates, exit.run
    # ------------------------------------------

    step_a:
      agents: [step-a]
      onEnter: log_state_entry
      exit:
        gates:
          step-a:
            - "$workspace/step-a.yaml"
        default: step_b

    step_b:
      agents: [step-b]
      entry_gates:
        - "$workspace/step-a.yaml"
      onExit: log_state_exit
      exit:
        gates:
          step-b:
            - "$workspace/step-b.yaml"
        default: step_c

    step_c:
      agents: [step-c]
      exit:
        gates:
          step-c:
            - "$workspace/step-c.yaml"
        run: "echo fan_out"

    # ------------------------------------------
    # HITL SELF-LOOP — file gate, default only
    # ------------------------------------------

    hitl_gate:
      agents: [hitl-agent]
      exit:
        gates:
          hitl-agent:
            - "$workspace/hitl-complete.yaml"
        default: fan_out

    # ------------------------------------------
    # ENSEMBLE — parallel, concat, fault_tolerance, timeout_ms
    # ------------------------------------------

    fan_out:
      ensemble:
        type: parallel
        agents:
          - worker-1
          - worker-2
          - worker-3
        aggregation: concat
        timeout_ms: 30000
        fault_tolerance:
          min_success_count: 2
          retry_failed: false
      exit:
        set:
          ensemble_output: "$ENSEMBLE_OUTPUT"
        default: verdict_check

    # ------------------------------------------
    # VERDICT — exit.set (yq), exit.when (==), exit.default
    # ------------------------------------------

    verdict_check:
      agents: [judge]
      exit:
        gates:
          judge:
            - "$workspace/verdict.yaml"
        set:
          result: "$(yq '.result' $workspace/verdict.yaml)"
        when:
          - condition: result == "pass"
            target: counter_loop
          - condition: result == "retry"
            target: retry
        default: counter_loop

    # ------------------------------------------
    # RETRY — entry.set arithmetic, gate script, exit.when (==)
    # ------------------------------------------

    retry:
      agents: [retrier]
      entry:
        set:
          retry_count: "$retry_count + 1"
      exit:
        gates:
          retrier:
            - check_max_retries
            - "$workspace/retry-ready.yaml"
        set:
          retries_exhausted: "$([ $retry_count -ge $max_retries ] && echo true || echo false)"
        when:
          - condition: retries_exhausted == "true"
            target: counter_loop
        default: fan_out

    # ------------------------------------------
    # COUNTER LOOP — entry.set arithmetic, exit.set bash, exit.when (!=), self-loop
    # ------------------------------------------

    counter_loop:
      agents: [looper]
      entry:
        set:
          iteration: "$iteration + 1"
      exit:
        gates:
          looper:
            - "$workspace/loop-result.yaml"
        set:
          loop_done: "$([ $iteration -ge $max_iterations ] && echo true || echo false)"
        when:
          - condition: loop_done != "false"
            target: finalize
        default: counter_loop

    # ------------------------------------------
    # FINALIZE — file gate, default
    # ------------------------------------------

    finalize:
      agents: [finalizer]
      exit:
        gates:
          finalizer:
            - "$workspace/summary.yaml"
        default: complete

    # ------------------------------------------
    # TERMINAL
    # ------------------------------------------

    complete:
      terminal: true

# ==========================================
# ROUTING — Agent message destinations
# ==========================================
# Routing tells agents where to send output. FSM validates transitions.
# Linear pipeline agents route to the next step.
# Branching/ensemble/completion agents route to core (FSM handles transition).

routing:
  entry:
    task-complete:
      core: "Entry complete, FSM routes by mode"

  step-a:
    task-complete:
      step-b: "Linear pipeline next step"

  step-b:
    task-complete:
      step-c: "Linear pipeline next step"

  step-c:
    task-complete:
      core: "Pipeline segment complete (FSM exit.run routes)"

  hitl-agent:
    message:
      core: "HITL test question"

  worker-1:
    task-complete:
      core: "Ensemble output collected by coordinator"

  worker-2:
    task-complete:
      core: "Ensemble output collected by coordinator"

  worker-3:
    task-complete:
      core: "Ensemble output collected by coordinator"

  judge:
    task-complete:
      core: "Verdict delivered (FSM routes by result)"

  retrier:
    task-complete:
      core: "Retry prep complete (FSM routes by exhaustion)"

  looper:
    task-complete:
      core: "Loop iteration complete (FSM routes by counter)"

  finalizer:
    task-complete:
      core: "Test summary complete"

# ==========================================
# WORKFLOW — Gate file manifest
# ==========================================

workflow:
  - id: test-config.yaml
    description: Test mode selector (mode field)
    location: session
    persistent: true
    reads: [entry]
    writes: []

  - id: step-a.yaml
    description: Linear step A gate file
    location: workspace
    reads: []
    writes: [step-a]

  - id: step-b.yaml
    description: Linear step B gate file
    location: workspace
    reads: []
    writes: [step-b]

  - id: step-c.yaml
    description: Linear step C gate file
    location: workspace
    reads: []
    writes: [step-c]

  - id: hitl-complete.yaml
    description: HITL completion signal
    location: workspace
    reads: []
    writes: [hitl-agent]

  - id: worker-1.yaml
    description: Ensemble worker 1 output
    location: workspace
    reads: []
    writes: [worker-1]

  - id: worker-2.yaml
    description: Ensemble worker 2 output
    location: workspace
    reads: []
    writes: [worker-2]

  - id: worker-3.yaml
    description: Ensemble worker 3 output
    location: workspace
    reads: []
    writes: [worker-3]

  - id: verdict.yaml
    description: "Judge verdict (result: pass|retry)"
    location: workspace
    reads: []
    writes: [judge]

  - id: retry-ready.yaml
    description: Retry preparation signal
    location: workspace
    reads: []
    writes: [retrier]

  - id: loop-result.yaml
    description: Loop iteration completion signal
    location: workspace
    reads: []
    writes: [looper]

  - id: summary.yaml
    description: Final test summary
    location: workspace
    reads: []
    writes: [finalizer]

# ==========================================
# WORKSPACE
# ==========================================

workspace:
  path: ".ai/test-fsm-full/"
  create_on_init: true
  locations:
    session: ".ai/tx/test-fsm-full/"
    workspace: ".ai/test-fsm-full/workspace/"
