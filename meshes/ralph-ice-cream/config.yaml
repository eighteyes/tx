mesh: ralph-ice-cream
description: "Layered quality refinement: haiku drafts, sonnet reviews, opus finalizes. Each layer loops until confident, then passes forward."

agents:
  - name: ralph-haiku
    model: haiku
    prompt: ralph-haiku/prompt.md

  - name: sonnet-reviewer
    model: sonnet
    prompt: sonnet-reviewer/prompt.md

  - name: opus-reviewer
    model: opus
    prompt: opus-reviewer/prompt.md

entry_point: ralph-haiku
completion_agent: opus-reviewer

routing:
  ralph-haiku:
    complete:
      sonnet-reviewer: "Quality threshold met, ready for sonnet review"
      ralph-haiku: "Below threshold, refining draft"
    blocked:
      core: "Cannot proceed - fatal error"

  sonnet-reviewer:
    complete:
      opus-reviewer: "Review complete, ready for opus final review"
      sonnet-reviewer: "Needs refinement, reviewing again"
    blocked:
      core: "Cannot proceed - fatal error"

  opus-reviewer:
    complete:
      core: "Final review complete - approved"
      opus-reviewer: "Final polish needed"
    blocked:
      core: "Cannot proceed - fatal error"

workspace:
  path: ".ai/ralph/{topic}/"

fsm:
  initial: ralph_haiku_loop

  context:
    haiku_iteration: 0
    sonnet_iteration: 0
    opus_iteration: 0
    max_haiku_iterations: 5
    max_sonnet_iterations: 3
    max_opus_iterations: 2

  states:
    ralph_haiku_loop:
      agents: [ralph-haiku]
      entry:
        set:
          haiku_iteration: "$((haiku_iteration + 1))"
      exit:
        gates:
          ralph-haiku:
            - check_haiku_max_iterations
        set:
          haiku_success_signal: "$(echo '$rearmatter' | yq '.success_signal')"
        when:
          - condition: haiku_success_signal == "PASS"
            target: sonnet_review_loop
          - condition: haiku_success_signal == "REFINE"
            target: ralph_haiku_loop
          - condition: haiku_success_signal == "BLOCKED"
            target: blocked_state
        default: ralph_haiku_loop

    sonnet_review_loop:
      agents: [sonnet-reviewer]
      entry:
        set:
          sonnet_iteration: "$((sonnet_iteration + 1))"
      exit:
        gates:
          sonnet-reviewer:
            - check_sonnet_max_iterations
        set:
          sonnet_success_signal: "$(echo '$rearmatter' | yq '.success_signal')"
        when:
          - condition: sonnet_success_signal == "PASS"
            target: opus_review_loop
          - condition: sonnet_success_signal == "REFINE"
            target: sonnet_review_loop
          - condition: sonnet_success_signal == "BLOCKED"
            target: blocked_state
        default: sonnet_review_loop

    opus_review_loop:
      agents: [opus-reviewer]
      entry:
        set:
          opus_iteration: "$((opus_iteration + 1))"
      exit:
        gates:
          opus-reviewer:
            - check_opus_max_iterations
        set:
          opus_success_signal: "$(echo '$rearmatter' | yq '.success_signal')"
        when:
          - condition: opus_success_signal == "PASS"
            target: complete
          - condition: opus_success_signal == "REFINE"
            target: opus_review_loop
          - condition: opus_success_signal == "BLOCKED"
            target: blocked_state
        default: opus_review_loop

    blocked_state:
      exit:
        default: error_state

    error_state: {}

    complete: {}

  scripts:
    check_haiku_max_iterations: |
      [[ $haiku_iteration -le $max_haiku_iterations ]] || {
        echo "Haiku max iterations ($max_haiku_iterations) reached" >&2
        exit 1
      }

    check_sonnet_max_iterations: |
      [[ $sonnet_iteration -le $max_sonnet_iterations ]] || {
        echo "Sonnet max iterations ($max_sonnet_iterations) reached" >&2
        exit 1
      }

    check_opus_max_iterations: |
      [[ $opus_iteration -le $max_opus_iterations ]] || {
        echo "Opus max iterations ($max_opus_iterations) reached" >&2
        exit 1
      }
