mesh: code-review-ensemble
description: "Parallel code review using FSM ensemble pattern - logic, architecture, robustness analysis"

agents:
  - name: entry
    model: haiku
    prompt: prompts/coordinator.md

  - name: reviewer-logic
    model: sonnet
    prompt: prompts/reviewer-logic.md

  - name: reviewer-architecture
    model: sonnet
    prompt: prompts/reviewer-architecture.md

  - name: reviewer-robustness
    model: haiku
    prompt: prompts/reviewer-robustness.md

  - name: synthesizer
    model: sonnet
    prompt: prompts/synthesizer.md

entry_point: entry

routing:
  # Entry agent: Routes to trigger parallel review state
  entry:
    complete:
      core: "Entry complete, triggering parallel review"

  # Ensemble agents: Each reports completion to synthesizer
  # Explicit routing enables message-based coordination
  reviewer-logic:
    complete:
      synthesizer: "Logic review complete"

  reviewer-architecture:
    complete:
      synthesizer: "Architecture review complete"

  reviewer-robustness:
    complete:
      synthesizer: "Robustness review complete"

  # Synthesizer: Routes back to core when done
  synthesizer:
    complete:
      core: "Review synthesis complete"

fsm:
  initial: entry_state

  states:
    entry_state:
      agents: [entry]
      exit:
        default: parallel_review

    parallel_review:
      # New structure: ensemble config with type inside
      ensemble:
        type: parallel
        agents: [reviewer-logic, reviewer-architecture, reviewer-robustness]
        aggregation: concat
        timeout_ms: 120000
      exit:
        set:
          review_results: "$ENSEMBLE_OUTPUT"
        default: synthesize

    synthesize:
      agents: [synthesizer]
      exit:
        default: complete

    complete:
      agents: [core]

  scripts: {}
