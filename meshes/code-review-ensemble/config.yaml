mesh: code-review-ensemble
description: "Parallel code review using FSM ensemble pattern - submit code to 3 reviewers, aggregate feedback"

agents:
  - name: entry
    model: haiku
    prompt: prompts/entry.md

  - name: reviewer-security
    model: haiku
    prompt: prompts/reviewer-security.md

  - name: reviewer-performance
    model: haiku
    prompt: prompts/reviewer-performance.md

  - name: reviewer-style
    model: haiku
    prompt: prompts/reviewer-style.md

  - name: synthesizer
    model: haiku
    prompt: prompts/synthesizer.md

entry_point: entry

fsm:
  initial: generate_subtasks

  states:
    generate_subtasks:
      agents: [entry]
      subtask: true
      exit:
        default: parallel_review

    parallel_review:
      type: ensemble
      ensemble:
        agents: [reviewer-security, reviewer-performance, reviewer-style]
        aggregation: concat
        timeout_ms: 120000
      exit:
        set:
          review_results: "$ENSEMBLE_OUTPUT"
        default: synthesize

    synthesize:
      agents: [synthesizer]
      exit:
        default: complete

    complete:
      agents: [core]

  scripts: {}
