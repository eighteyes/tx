mesh: code-review-ensemble
description: "Parallel code review using FSM ensemble pattern - logic, architecture, robustness analysis"

agents:
  - name: entry
    model: haiku
    prompt: prompts/coordinator.md

  - name: reviewer-logic
    model: sonnet
    prompt: prompts/reviewer-logic.md

  - name: reviewer-architecture
    model: sonnet
    prompt: prompts/reviewer-architecture.md

  - name: reviewer-robustness
    model: haiku
    prompt: prompts/reviewer-robustness.md

  - name: synthesizer
    model: sonnet
    prompt: prompts/synthesizer.md

entry_point: entry

routing:
  # Entry agent: Routes via FSM exit routing (subtask: true generates tasks for ensemble)
  # No explicit routing needed - FSM handles transition to parallel_review state
  entry:
    complete:
      core: "Subtasks generated for parallel review"

  # Ensemble agents (reviewer-*): No explicit routing needed
  # Their results are collected by EnsembleCoordinator, not routed as messages
  # FSM handles aggregation and transition to synthesize state

  # Synthesizer: Routes back to core when done
  synthesizer:
    complete:
      core: "Review synthesis complete"

fsm:
  initial: generate_subtasks

  states:
    generate_subtasks:
      agents: [entry]
      subtask: true
      exit:
        default: parallel_review

    parallel_review:
      type: ensemble
      ensemble:
        agents: [reviewer-logic, reviewer-architecture, reviewer-robustness]
        aggregation: concat
        timeout_ms: 120000
      exit:
        set:
          review_results: "$ENSEMBLE_OUTPUT"
        default: synthesize

    synthesize:
      agents: [synthesizer]
      exit:
        default: complete

    complete:
      agents: [core]

  scripts: {}
