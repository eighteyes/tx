mesh: dev-lite
description: "Lightweight developer mesh for simple features, quick fixes, and straightforward work"

intents:
  patterns:
    - build
    - implement
    - "code up"
    - fix
    - develop
  commands:
    build: "/know:build"
    implement: "/know:build"

agents:
  - name: worker
    model: sonnet
    prompt: prompt.md

entry_point: worker

workspace:
  path: ".ai/output/{task-id}/"

routing:
  worker:
    complete:
      core: "Implementation complete"
    blocked:
      core: "Need clarification or human input"
