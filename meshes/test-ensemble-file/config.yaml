mesh: test-ensemble-file
description: "Parallel ensemble with file-based coordination, FSM gates, and context injection"

agents:
  - name: entry
    model: haiku
    prompt: entry.md

  - name: worker-1
    model: haiku
    prompt: worker-1.md

  - name: worker-2
    model: haiku
    prompt: worker-2.md

  - name: worker-3
    model: haiku
    prompt: worker-3.md

  - name: synthesizer
    model: sonnet
    prompt: synthesizer.md

entry_point: entry

# Workspace configuration for file-based coordination
# Creates workspace directory and defines expected output files
workspace:
  path: "workspace/"
  output:
    task-input.md: "Task definition written by entry agent"
    worker-1-output.md: "Worker 1 results"
    worker-2-output.md: "Worker 2 results"
    worker-3-output.md: "Worker 3 results"
  create_on_init: true

# Routing: Entry fans out to workers, workers don't route (file-based completion)
# Synthesizer routes to core when done
routing:
  # Entry agent - fans out to ALL workers for parallel execution
  entry:
    complete:
      worker-1: "Process task, write to worker-1-output.md"
      worker-2: "Process task, write to worker-2-output.md"
      worker-3: "Process task, write to worker-3-output.md"

  # Workers DON'T route - they complete by writing files
  # The FSM gate script monitors for file existence
  # After workers complete, FSM transitions to synthesis state

  # Synthesizer routes to core when done
  synthesizer:
    complete:
      core: "Final synthesis complete"

fsm:
  initial: entry

  states:
    entry:
      agents: [entry]
      exit:
        default: ensemble

    # Ensemble state: FSM manages parallel worker execution
    # Workers are spawned via handleEnsembleState when FSM detects ensemble config
    # The gate script polls for output files before transitioning
    ensemble:
      ensemble:
        type: parallel
        agents: [worker-1, worker-2, worker-3]
        aggregation: concat
        timeout_ms: 60000

      exit:
        default: synthesis
        gate:
          type: script
          script: check-all-outputs
          poll_interval: 2000
          timeout: 120000
        set:
          aggregated_output: "$ENSEMBLE_OUTPUT"

    synthesis:
      agents: [synthesizer]
      context:
        - aggregated_output
      exit:
        default: complete

    complete:
      agents: []

  scripts:
    check-all-outputs: |
      #!/usr/bin/env bash
      # Check all 3 worker output files exist
      WORKSPACE="/workspace/tx-cli-v4/workspace"
      [ -f "$WORKSPACE/worker-1-output.md" ] && \
      [ -f "$WORKSPACE/worker-2-output.md" ] && \
      [ -f "$WORKSPACE/worker-3-output.md" ]

type: ephemeral
auto_despawn: true

playbook_notes: |
  Test mesh demonstrating:
  - Parallel ensemble execution (3 workers)
  - File-based coordination pattern
  - Exit gate with script-based synchronization barrier
  - Context variable injection from script output
  - Workspace auto-creation

  Architecture:
  - Entry agent writes task-input.md, then FSM routes to workers
  - FSM ensemble state spawns all 3 workers in parallel
  - Workers write files to workspace, signal completion via file existence
  - Gate script polls until all output files exist
  - FSM aggregates outputs into $ENSEMBLE_OUTPUT context variable
  - Synthesizer receives aggregated content, produces final report

  Key Pattern: FSM handles ensemble orchestration - workers DON'T route to
  synthesizer directly. The gate script acts as a synchronization barrier.
