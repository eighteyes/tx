mesh: dev-graded
description: "Developer mesh with grading and iteration for quality assurance, use to evaluate large swaths of work, not for everyday development."

graded: true
iteration:
  maxIterations: 5
  onFail: loop

agents:
  - name: worker
    model: opus
    prompt: prompt.md

entry_point: worker

workspace:
  path: ".ai/output/{task-id}/"

routing:
  worker:
    complete:
      core: "Implementation complete"
    blocked:
      core: "Need clarification or human input"
