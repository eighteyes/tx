mesh: dev-graded
description: "Developer mesh with grading and iteration for quality assurance"

graded: true
iteration:
  maxIterations: 5
  onFail: loop

intents:
  patterns:
    - build
    - implement
    - "code up"
    - fix
    - develop
  commands:
    build: "/know:build"
    implement: "/know:build"

agents:
  - name: worker
    model: opus
    prompt: prompt.md

entry_point: worker

workspace:
  path: ".ai/output/{task-id}/"

routing:
  worker:
    complete:
      core: "Implementation complete"
    blocked:
      core: "Need clarification or human input"
