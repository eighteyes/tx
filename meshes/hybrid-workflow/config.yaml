mesh: hybrid-workflow
description: "Combined ensemble and task distribution pattern"

agents:
  - name: spawner
    model: sonnet
    prompt: prompts/spawner.md

  - name: worker-1
    model: haiku
    prompt: prompts/worker.md

  - name: worker-2
    model: haiku
    prompt: prompts/worker.md

  - name: analyzer-1
    model: sonnet
    prompt: prompts/analyzer.md

  - name: analyzer-2
    model: sonnet
    prompt: prompts/analyzer.md

  - name: synthesizer
    model: opus
    prompt: prompts/synthesizer.md

entry_point: spawner

routing:
  spawner:
    complete:
      synthesizer: "Subtasks spawned"
    blocked:
      core: "Need task clarification"
  worker-1:
    complete:
      spawner: "Work complete"
    blocked:
      spawner: "Blocked"
  worker-2:
    complete:
      spawner: "Work complete"
    blocked:
      spawner: "Blocked"
  analyzer-1:
    complete:
      synthesizer: "Analysis complete"
    blocked:
      spawner: "Need more data"
  analyzer-2:
    complete:
      synthesizer: "Analysis complete"
    blocked:
      spawner: "Need more data"
  synthesizer:
    complete:
      core: "Synthesis complete"
    blocked:
      spawner: "Need refinement"

task_distribution:
  spawner: spawner
  subagents: [worker-1, worker-2]
  reviewer: synthesizer
  distribution_strategy: equal
  subtask_count: 2
  timeout_ms: 180000

ensemble:
  agents: [analyzer-1, analyzer-2]
  aggregation_strategy: consensus
  timeout_ms: 120000
