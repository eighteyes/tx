# Test mesh for session-forking feature
# Verifies: checkpoint, fork_from, session continuation across agents

mesh: test-session-forking
description: "Test mesh for session forking - checkpoint and fork_from functionality"

agents:
  - name: setup
    model: haiku
    prompt: setup.md
    load:
      - "package.json"
    checkpoint: true  # Save session for forking

  - name: worker-a
    model: sonnet
    prompt: worker.md
    fork_from: setup  # Fork from setup's checkpoint

  - name: worker-b
    model: sonnet
    prompt: worker.md
    fork_from: setup  # Fork from same checkpoint

entry_point: setup

routing:
  setup:
    complete:
      worker-a: "Setup complete, fork to worker A"
  worker-a:
    complete:
      worker-b: "Worker A done"
  worker-b:
    complete:
      core: "All workers complete"
