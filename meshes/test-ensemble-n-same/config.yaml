mesh: test-ensemble-n-same
description: "Dynamic N-worker ensemble with identical task distribution and quality-based voting"

agents:
  - name: entry
    model: sonnet
    prompt: entry.md

  - name: worker
    model: haiku
    prompt: worker.md

  - name: voter
    model: sonnet
    prompt: voter.md

entry_point: entry

routing:
  # Entry: Routes to worker agent (FSM spawns N instances)
  entry:
    complete:
      worker: "Entry analyzed task, spawn workers"

  # Worker: Routes to voter when complete
  worker:
    complete:
      voter: "Worker completed task"

  # Voter: Routes to core with final result
  voter:
    complete:
      core: "Voter selected best result"

fsm:
  initial: entry

  context:
    parallel_count: 3

  states:
    entry:
      agents: [entry]
      exit:
        default: spawn_workers

    spawn_workers:
      ensemble:
        type: parallel
        agent: worker
        count: $parallel_count
        aggregation: concat
        timeout_ms: 120000
      exit:
        set:
          worker_results: "$ENSEMBLE_OUTPUT"
        default: voter

    voter:
      agents: [voter]
      exit:
        default: complete

    complete:
      terminal: true

  scripts: {}

type: ephemeral
auto_despawn: true

playbook_notes: |
  ## Design Rationale

  This mesh demonstrates dynamic N-worker ensemble patterns where:

  1. **Entry agent**: Analyzes the incoming task and prepares context
  2. **Worker agents**: Three identical haiku instances (via FSM ensemble) process the same task in parallel
  3. **Voter agent**: Receives aggregated worker outputs and selects the best result

  The FSM orchestrates:
  - Sequential entry → parallel workers (ensemble) → sequential voter
  - Dynamic worker count via FSM context variable ($parallel_count)
  - Aggregated output injection via $ENSEMBLE_OUTPUT

  Key features:
  - FSM ensemble pattern with `type: parallel` and `agent: worker` + `count`
  - Workers receive ENSEMBLE_INDEX and ENSEMBLE_TOTAL for self-identification
  - Voter receives all worker outputs concatenated with agent labels
  - Ephemeral lifecycle with auto-despawn
