# narrative-engine-fsm/config.yaml
# LLM-Native Tabletop RPG System - FSM-Controlled Deterministic Routing
# All coordinator routing replaced by file-state transitions

mesh: narrative-engine-fsm
description: "Stateless RPG with FSM routing. File presence IS state. Agents write files, exit. FSM checks gates, routes to next state. No LLM decides routing."

agents:
  # ==========================================
  # ENTRY AGENT (reads session, FSM routes)
  # ==========================================

  - name: entry
    model: sonnet
    prompt: coordinator/entry.md

  # ==========================================
  # CREATIVE AGENTS (sonnet/opus)
  # ==========================================

  - name: calibrator
    model: opus
    prompt: calibrator/prompt.md
    # Game creation — HITL worldbuilding extraction
    # 9-phase extraction loop via HITL messages to core
    # Creates author.yaml, setting.yaml, arc.yaml, entities
    # FSM gates on game files to transition out

  - name: init-coord
    model: sonnet
    prompt: coordinator/init-coord.md
    # Creates context.yaml for turn/prologue workspace

  - name: dramaturg
    model: sonnet
    prompt: dramaturg/prompt.md
    # Story-aware outcome suggestions
    # Reads arc context, suggests weight adjustments

  - name: system
    model: sonnet
    prompt: system/prompt.md
    # Mechanics engine, outcome tables, trait tracking
    # Accepts dramaturg notes for story-aware weighting

  - name: cast
    model: sonnet
    prompt: cast/prompt.md
    # NPC voices, reactions, character consistency

  - name: scene-crafter
    model: sonnet
    prompt: scene-crafter/prompt.md
    # Scene structure, beats, transitions, pacing
    # Identifies decision points for player agency

  - name: narrator
    model: opus
    prompt: narrator/prompt.md
    # Prose rendering with staged build (1.5-2k words)
    # Receives fully-decided outline from scene-crafter

  - name: editor
    model: opus
    prompt: editor/prompt.md
    # Adversarial prose review against author.yaml
    # Writes editor-verdict.yaml {verdict: approve|revise}

  - name: oracle
    model: sonnet
    prompt: oracle/prompt.md
    # Continuity validation + knowledge queries
    # Writes oracle-result.yaml {verdict: pass|fail}

  - name: scribe
    model: sonnet
    prompt: scribe/prompt.md
    # Context compression, state management, game canon promotion

  # ==========================================
  # LINT LADDER — Parallel mechanical linters
  # FSM ensemble replaces lint-coordinator
  # ==========================================

  - name: lint-forbidden-words
    model: haiku
    prompt: linters/forbidden-words.md
    # Mechanical: forbidden words + concordance overuse

  - name: lint-patterns
    model: sonnet
    prompt: linters/patterns.md
    # Creative: forbidden patterns needing narrator rewrite

  - name: lint-ai-tells
    model: haiku
    prompt: linters/ai-tells.md
    # Mechanical: archaic/formal AI vocabulary

  - name: lint-cadence
    model: sonnet
    prompt: linters/cadence.md
    # Creative: sentence length distribution, rhythm

  - name: lint-dialogue
    model: haiku
    prompt: linters/dialogue.md
    # Mechanical: dialogue tags, adverbs, coherence

  - name: lint-litotes
    model: sonnet
    prompt: linters/litotes.md
    # Creative: "not X, but Y" patterns (budget: 1-2/scene)

  - name: lint-metaphor
    model: sonnet
    prompt: linters/metaphor.md
    # Creative: repeated sensory channels

  - name: lint-body-first
    model: sonnet
    prompt: linters/body-first.md
    # Creative: scene opening physical grounding

  - name: lint-factoids
    model: haiku
    prompt: linters/lint-factoids.md
    # Creative: real-world trivia repetition detection

  - name: lint-temporal
    model: haiku
    prompt: linters/lint-temporal.md
    # Creative: temporal continuity contradictions

entry_point: entry

# FSM terminal state handles completion signaling
completion_agents:
  - scribe

# ==========================================
# FSM — Deterministic file-state routing
# ==========================================

fsm:
  initial: entry

  context:
    mode: null              # new_game | prologue | turn (set by entry)
    turn: 0
    workspace: null
    game_id: null
    campaign_id: null
    game_path: null
    render_iteration: 0
    max_render_iterations: 3
    oracle_iteration: 0
    max_oracle_iterations: 2

  scripts:
    check_max_render_iterations: |
      [[ $render_iteration -le $max_render_iterations ]]
    check_max_oracle_iterations: |
      [[ $oracle_iteration -le $max_oracle_iterations ]]

  states:
    # ------------------------------------------
    # ENTRY & GAME CREATION
    # ------------------------------------------

    entry:
      agents: [entry]
      exit:
        set:
          mode: "$(yq '.mode // \"turn\"' $session_path)"
          game_id: "$(yq '.game_id' $session_path)"
          campaign_id: "$(yq '.campaign_id' $session_path)"
          turn: "$(yq '.turn // 0' $session_path)"
          workspace: "$(yq '.workspace' $session_path)"
          game_path: "$(yq '.game_path' $session_path)"
        when:
          - condition: mode == "new_game"
            target: game_creation
          - condition: mode == "prologue"
            target: prologue_init
        default: init

    game_creation:
      agents: [calibrator]
      exit:
        gates:
          calibrator:
            - "$game_path/setting.yaml"
            - "$game_path/author.yaml"
        default: prologue_init

    prologue_init:
      agents: [init-coord]
      exit:
        gates:
          init-coord:
            - "$workspace/context.yaml"
        default: prep_dramaturg

    # ------------------------------------------
    # INIT (turn pipeline entry for mode==turn)
    # ------------------------------------------

    init:
      agents: [init-coord]
      exit:
        gates:
          init-coord:
            - "$workspace/context.yaml"
        default: prep_dramaturg

    # ------------------------------------------
    # PREP PIPELINE (linear file-gated)
    # ------------------------------------------

    prep_dramaturg:
      agents: [dramaturg]
      exit:
        gates:
          dramaturg:
            - "$workspace/dramaturg-notes.yaml"
        default: prep_system

    prep_system:
      agents: [system]
      exit:
        gates:
          system:
            - "$workspace/resolution.yaml"
        default: prep_cast

    prep_cast:
      agents: [cast]
      exit:
        gates:
          cast:
            - "$workspace/reactions.yaml"
        default: prep_scene

    prep_scene:
      agents: [scene-crafter]
      exit:
        gates:
          scene-crafter:
            - "$workspace/scene-outline.yaml"
        default: render_draft

    # ------------------------------------------
    # RENDER PIPELINE (loops + ensemble)
    # ------------------------------------------

    render_draft:
      agents: [narrator]
      exit:
        gates:
          narrator:
            - "$workspace/prose-draft.md"
        default: render_lint

    render_lint:
      ensemble:
        type: parallel
        agents:
          - lint-forbidden-words
          - lint-patterns
          - lint-ai-tells
          - lint-cadence
          - lint-dialogue
          - lint-litotes
          - lint-metaphor
          - lint-body-first
          - lint-factoids
          - lint-temporal
        aggregation: concat
        timeout_ms: 120000
        fault_tolerance:
          min_success_count: 7
          retry_failed: false
      exit:
        set:
          lint_results: "$ENSEMBLE_OUTPUT"
        default: render_edit

    render_edit:
      agents: [editor]
      exit:
        gates:
          editor:
            - "$workspace/editor-verdict.yaml"
        set:
          editor_verdict: "$(yq '.verdict' $workspace/editor-verdict.yaml)"
        when:
          - condition: editor_verdict == "approve"
            target: validate_oracle
          - condition: editor_verdict == "revise"
            target: render_revise
        default: validate_oracle

    render_revise:
      agents: [narrator]
      entry:
        set:
          render_iteration: "$((render_iteration + 1))"
      exit:
        gates:
          narrator:
            - check_max_render_iterations
            - "$workspace/prose-draft.md"
        default: render_lint

    # ------------------------------------------
    # VALIDATION & COMPLETION
    # ------------------------------------------

    validate_oracle:
      agents: [oracle]
      entry:
        set:
          oracle_iteration: "$((oracle_iteration + 1))"
      exit:
        gates:
          oracle:
            - check_max_oracle_iterations
            - "$workspace/oracle-result.yaml"
        set:
          oracle_verdict: "$(yq '.verdict' $workspace/oracle-result.yaml)"
        when:
          - condition: oracle_verdict == "pass"
            target: compress
          - condition: oracle_verdict == "fail"
            target: render_revise
        default: compress

    compress:
      agents: [scribe]
      exit:
        gates:
          scribe:
            - "$workspace/summary.md"
        default: complete

    complete:
      terminal: true

# ==========================================
# ROUTING — Agent message destinations
# ==========================================
# Routing tells agents where to send output. FSM validates transitions.
# Pipeline agents route to the next step.
# Branching/ensemble/completion agents route to core (FSM handles transition).

routing:
  # Entry agent validates session and sets context for FSM
  entry:
    message:
      core: "Turn in progress OR message-state confusion"
    task-complete:
      core: "Entry complete, FSM routes by mode"

  # Calibrator HITL loop — questions to human during game creation
  calibrator:
    message:
      core: "HITL extraction / worldbuilder tuning | Session complete"
    task-complete:
      core: "Game creation complete (FSM gates on game files)"

  # Init-coord: creates context.yaml, advances to dramaturg
  init-coord:
    task-complete:
      dramaturg: "Context prepared, advance to dramaturg analysis"

  # Dramaturg: story analysis, advances to system
  dramaturg:
    task-complete:
      system: "Story analysis complete, advance to mechanics"

  # System: mechanics engine, advances to cast
  system:
    task-complete:
      cast: "Resolution complete, advance to NPC reactions"

  # Cast: NPC reactions, advances to scene-crafter
  cast:
    task-complete:
      scene-crafter: "Reactions complete, advance to scene structure"

  # Scene-crafter: scene structure + HITL player decisions
  scene-crafter:
    message:
      core: "Mid-turn player decisions"
    task-complete:
      narrator: "Scene outline complete, advance to prose rendering"

  # Narrator: prose rendering + ad-hoc knowledge queries
  narrator:
    message:
      oracle: "Knowledge query"
    task-complete:
      core: "Draft complete (FSM routes to lint ensemble)"

  # Editor: adversarial review + revision feedback
  editor:
    message:
      narrator: "Fix violations"
    task-complete:
      core: "Edit verdict delivered (FSM routes by verdict)"

  # Oracle: continuity validation + knowledge responses
  oracle:
    message:
      narrator: "Knowledge query response"
    task-complete:
      core: "Continuity verdict delivered (FSM routes by verdict)"

  # Scribe: context compression, completion agent
  scribe:
    task-complete:
      core: "Turn summary complete"

  # Lint ensemble agents — output collected by EnsembleCoordinator
  lint-forbidden-words:
    task-complete:
      core: "Lint scan complete"

  lint-patterns:
    task-complete:
      core: "Lint scan complete"

  lint-ai-tells:
    task-complete:
      core: "Lint scan complete"

  lint-cadence:
    task-complete:
      core: "Lint scan complete"

  lint-dialogue:
    task-complete:
      core: "Lint scan complete"

  lint-litotes:
    task-complete:
      core: "Lint scan complete"

  lint-metaphor:
    task-complete:
      core: "Lint scan complete"

  lint-body-first:
    task-complete:
      core: "Lint scan complete"

  lint-factoids:
    task-complete:
      core: "Lint scan complete"

  lint-temporal:
    task-complete:
      core: "Lint scan complete"

# ==========================================
# MANIFEST — File-centric I/O manifest
# ==========================================

manifest:
  # --- Session State ---
  - id: session.yaml
    description: Session state persisted across turns
    location: session
    persistent: true
    reads: [entry, init-coord, calibrator]
    writes: [entry, init-coord, calibrator]

  # --- Turn Workspace (per-turn artifacts) ---
  - id: context.yaml
    description: Turn context seeded by init-coord, consumed by creative agents
    location: workspace
    reads: [dramaturg, system, cast, scene-crafter, narrator, scribe]
    writes: [init-coord]

  - id: dramaturg-notes.yaml
    description: Story analysis and weight adjustment suggestions
    location: workspace
    reads: [system, narrator]
    writes: [dramaturg]

  - id: resolution.yaml
    description: Mechanical outcome tables and trait resolution
    location: workspace
    reads: [cast, scene-crafter, narrator, scribe]
    writes: [system]

  - id: reactions.yaml
    description: NPC reactions and character voice responses
    location: workspace
    reads: [scene-crafter, narrator, scribe]
    writes: [cast]

  - id: scene-outline.yaml
    description: Scene beats, pacing, and decision points
    location: workspace
    reads: [narrator]
    writes: [scene-crafter]

  - id: prose-draft.md
    description: Working prose draft iterated through lint/edit cycle
    location: workspace
    reads: [narrator, editor, lint-forbidden-words, lint-patterns, lint-ai-tells, lint-cadence, lint-dialogue, lint-litotes, lint-metaphor, lint-body-first, lint-factoids, lint-temporal]
    writes: [narrator, editor]

  - id: prose.md
    description: Final approved prose output for the turn
    location: workspace
    reads: [scribe]
    writes: [narrator]

  - id: concordance.txt
    description: Per-turn word frequency extract for overuse detection
    location: workspace
    reads: [lint-forbidden-words]
    writes: [narrator]

  - id: dialogue-pairs.txt
    description: Extracted dialogue tag/line pairs for lint analysis
    location: workspace
    reads: [lint-dialogue]
    writes: [narrator]

  - id: violations.yaml
    description: Aggregated lint violations for editor review
    location: workspace
    reads: [editor]
    writes: [editor]

  - id: editor-verdict.yaml
    description: Editor decision — approve or revise
    location: workspace
    reads: []
    writes: [editor]

  - id: oracle-result.yaml
    description: Oracle continuity verdict — pass or fail
    location: workspace
    reads: []
    writes: [oracle]

  - id: summary.md
    description: Compressed turn summary for context window management
    location: workspace
    reads: []
    writes: [scribe]

  - id: calibration-state.yaml
    description: HITL calibration extraction progress tracker
    location: workspace
    reads: [calibrator]
    writes: [calibrator]

  # --- Linter output files (written by ensemble agents) ---
  - id: lint-forbidden-words.yaml
    description: Forbidden word scan results
    location: workspace
    reads: [editor]
    writes: [lint-forbidden-words]

  - id: lint-patterns.yaml
    description: Forbidden pattern scan results
    location: workspace
    reads: [editor]
    writes: [lint-patterns]

  - id: lint-ai-tells.yaml
    description: AI tell detection results
    location: workspace
    reads: [editor]
    writes: [lint-ai-tells]

  - id: lint-cadence.yaml
    description: Cadence analysis results
    location: workspace
    reads: [editor]
    writes: [lint-cadence]

  - id: lint-dialogue.yaml
    description: Dialogue tag/adverb check results
    location: workspace
    reads: [editor]
    writes: [lint-dialogue]

  - id: lint-litotes.yaml
    description: Litotes pattern check results
    location: workspace
    reads: [editor]
    writes: [lint-litotes]

  - id: lint-metaphor.yaml
    description: Metaphor/sensory channel results
    location: workspace
    reads: [editor]
    writes: [lint-metaphor]

  - id: lint-body-first.yaml
    description: Body-first grounding check results
    location: workspace
    reads: [editor]
    writes: [lint-body-first]

  - id: lint-factoids.yaml
    description: Factoid repetition detection results
    location: workspace
    reads: [editor]
    writes: [lint-factoids]

  - id: lint-temporal.yaml
    description: Temporal continuity check results
    location: workspace
    reads: [editor]
    writes: [lint-temporal]

  # --- Game Root ---
  - id: author.yaml
    description: Author voice profile and stylistic constraints
    location: game
    persistent: true
    reads: [narrator, scene-crafter, editor, calibrator, lint-forbidden-words, lint-ai-tells]
    writes: [calibrator]

  - id: setting.yaml
    description: World setting, geography, tone, and genre parameters
    location: game
    persistent: true
    reads: [oracle, calibrator]
    writes: [calibrator]

  - id: entities.yaml
    description: Master entity index with traits, relationships, status
    location: game
    persistent: true
    reads: [system, narrator, oracle, scribe, calibrator]
    writes: [scribe, calibrator]

  - id: story-corpus.txt
    description: Append-only full prose archive across all turns
    location: game
    persistent: true
    reads: []
    writes: [scribe]

  - id: story-concordance.txt
    description: Cumulative word frequency data for cross-turn overuse detection
    location: game
    persistent: true
    reads: [lint-forbidden-words]
    writes: [scribe]

  # --- Campaign State ---
  - id: arc.yaml
    description: Story arc structure, act progression, and tension curves
    location: campaign
    persistent: true
    reads: [dramaturg, system, scribe, calibrator]
    writes: [scribe, calibrator]

  - id: state.yaml
    description: Campaign mechanical state — active effects, conditions, resources
    location: campaign
    persistent: true
    reads: [dramaturg, system, scribe]
    writes: [scribe]

  - id: continuity.yaml
    description: Canonical facts, established details, and continuity anchors
    location: campaign
    persistent: true
    reads: [dramaturg, narrator, oracle, scribe, system]
    writes: [scribe]

  - id: history.md
    description: Narrative history log of completed turns
    location: campaign
    persistent: true
    reads: []
    writes: [scribe]

  - id: thread.md
    description: Active narrative threads and unresolved hooks
    location: campaign
    persistent: true
    reads: []
    writes: [scribe]

  - id: character-memory.yaml
    description: Per-character memory and relationship state
    location: campaign
    persistent: true
    reads: []
    writes: [scribe]

  # --- Entity Files ---
  - id: characters/protagonist.yaml
    description: Player character sheet — traits, inventory, conditions
    location: entities
    persistent: true
    reads: [scribe, calibrator]
    writes: [scribe, calibrator]

  # --- Templates (read-only reference) ---
  - id: arc.template.yaml
    description: Arc structure template for new campaign creation
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: entities.template.yaml
    description: Entity index template for new game creation
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: author.template.yaml
    description: Author voice profile template
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: setting.template.yaml
    description: World setting template
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: session.template.yaml
    description: Session state template for init
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: continuity.template.yaml
    description: Continuity tracking template
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: entities/characters/protagonist.template.yaml
    description: Protagonist character sheet template
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

# ==========================================
# WORKSPACE
# ==========================================

workspace:
  path: ".ai/games/"
  create_on_init: false
  locations:
    session: ".ai/tx/narrative-engine-fsm/"
    workspace: "{game}/campaigns/{campaign-id}/turns/turn-{N}/"
    game: ".ai/games/{game-id}/"
    campaign: "{game}/campaigns/{campaign-id}/"
    entities: "{game}/entities/"
    template: "meshes/narrative-engine-fsm/templates/"

# Turn workspace template (resolved after game exists)
turn_workspace:
  path: ".ai/games/{game-id}/campaigns/{campaign-id}/turns/"
  create_on_init: false
  cleanup_on_complete: false
