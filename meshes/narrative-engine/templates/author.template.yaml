# author.yaml - Writing voice and style semantics
# Copy this template to .ai/games/{game-id}/author.yaml
# NARRATOR reads this to calibrate prose rendering
#
# Every game has its own author. This file IS that author's voice.

# Overall voice descriptor (1 line)
voice: "dry, embodied, system-literate; skeptical but non-moralizing"

# Point of view
pov:
  lens: close_interior          # close_interior | distant_third | omniscient | second_person
  technique: free_indirect      # free_indirect | direct_interior | reported | stream
  # free_indirect: thoughts blend into narration without "she thought"
  # direct_interior: explicit "she thought" or italicized thoughts
  # stream: unfiltered consciousness

# Tense
tense:
  baseline: past                # past | present
  variations:
    - trigger: "loops, compulsion, obsessive thought"
      shift_to: present_progressive
    # - trigger: "memories"
    #   shift_to: past_perfect

# Pacing and balance
pacing:
  turn_length:
    target: medium               # short (800-1200) | medium (1500-2000) | long (2500-3500)
    description: "How much prose per turn"
  action_density:
    target: balanced             # dense (lots happens) | balanced | sparse (moments breathe)
    description: "How much plot/action advances per turn"

balance:
  internal_external:
    ratio: 30/70                 # internal/external — 30/70 = action-forward, 70/30 = introspective
    description: "Time in character's head vs showing external action"
  dialogue_description:
    ratio: 40/60                 # dialogue/description — 40/60 = prose-heavy, 60/40 = talky
    description: "Conversation vs narrative description"
  dwelling:
    emotional_moments: moderate  # minimal | moderate | extensive
    description: "How long to sit with significant feelings"

# Sentence cadence (percentages should sum to ~100)
cadence:
  long:                         # 30-50 words, braided clauses
    percentage: 30
    description: "Complex sentences with embedded clauses, building tension"
  medium:                       # 12-25 words
    percentage: 55
    description: "Workhouse sentences, clear and propulsive"
  short:                        # 1-6 words
    percentage: 15
    description: "Punches. Impact. Breath."
  fragments:
    count: "3-5 per scene"
    description: "Purposeful incomplete thoughts"

# Stylistic devices (counts per scene/turn)
devices:
  catalog_list:
    count: 1
    format: "spaced ellipses"
    example: "the coffee … the window … the sound of her own breathing"
  parentheticals:
    count: "2-4"
    format: "spaced"
    example: "She waited ( longer than she should have ) for the reply."
  italics:
    count: "2-5"
    use: "somatic sensation, affect, emphasis"
    example: "The *ache* behind her eyes sharpened."
  meta_brackets:
    count: "0-1"
    use: "system intrusion, glitch, frame-break"
    example: "[ loading … ]"
  code_fences:
    allowed: true
    use: "commands, logs, system output only — never dialogue"

# Diction palette (word families to draw from)
diction:
  primary:
    - category: somatic
      words: [ache, tendon, pulse, jaw, hands, breath, gut, spine]
    - category: cognitive_tech
      words: [protocol, latency, loop, buffer, signal, process, cache]
  secondary:
    - category: corporate
      words: [policy, safety, throughput, compliance, metrics, stakeholder]
    - category: scientific
      words: [neurochemistry, systems, method, mechanism, threshold, gradient]
  texture:
    - category: dynamics
      words: [stasis, movement, force, gather, spread, pressure, release]
    - category: ephemeral
      words: [spirit, energy, mind, presence, absence, trace, echo]

# Punctuation constraints
punctuation:
  semicolons: forbidden         # forbidden | rare | allowed
  colons:
    max_per_scene: 1
  em_dashes: allowed            # preferred for interruption/pivot
  ellipses:
    use: "trailing thought, catalog lists"
    in_dialogue: rare

# Formatting
formatting:
  markdown_headings: forbidden  # forbidden | scene_breaks_only | allowed
  horizontal_rules: forbidden   # use prose transitions instead
  paragraph_length: "varied, 1-5 sentences"

# Scene endings
endings:
  style: attenuate              # attenuate | cliffhanger | resolution | question
  # attenuate: trail off, unresolved, echo
  # cliffhanger: sharp cut at tension peak
  # resolution: beat lands, moment of stillness
  # question: explicit or implicit question hanging
  description: "No tidy conclusions. Let it linger."

# What to preserve vs transform
transformation_rule: "Preserve all facts and content; change only diction, cadence, and punctuation."

# ═══════════════════════════════════════════════════════════
# UNIVERSAL CONSTRAINTS (apply to all games)
# ═══════════════════════════════════════════════════════════

universal:

  ugly_word_list:
    avoid: [He, His, The, Then, But, She, And, This, That]
    rule: NEVER start a sentence with these words. Mid-sentence use only when no graceful alternative exists.
    guidance: |
      These words work but rarely sing. Prefer alternatives:
      "He walked" → "Walking the shore, he..." or start with object/sensation
      "The lake" → "Copper light on still water—the lake..."
      "But" → em-dash, semicolon, or restructure
      "She said" → action beat, or cut tag entirely
      Never start consecutive sentences with the same word.

  word_doubling:
    rule: NEVER repeat a word within the same sentence or adjacent sentences
    guidance: |
      Find synonyms, restructure, or cut. If "water" appears in one sentence,
      the next must use "lake", "surface", "wet", or nothing.
      Exception: intentional poetic repetition for rhythm (rare, marked)

  litotes:
    budget: 2  # Max 1-2 per scene. AI defaults to 20+. Unacceptable.
    rule: Default to positive. Say what it IS, not what it isn't.
    forbidden_constructions:
      - "not X, but Y"       # "not anger, but recognition" → name the thing
      - "not X—Y"            # "not word—wound" → commit to wound
      - "not [adj], not [adj]"  # stacking negations = lazy emphasis
      - "Not [noun]. [Statement]"  # "Not evasion. Truth." → just say truth
    when_acceptable: "Emphasis through denial. 'This was not a man who asked twice.' Earns its negative."

  em_dashes:
    budget: 3  # Max 2-3 per scene. AI overuses em-dashes where commas belong.
    rule: Use for interruption, pivot, or aside—not as default punctuation.
    guidance: |
      LLMs insert em-dashes everywhere humans would use commas, parentheses,
      or colons. If you've used 3, convert the next one to something else.

  lists_of_three:
    budget: 1  # Max 1 per scene. Triadic lists are an AI crutch.
    rule: Vary rhythm. Two items or four. Three feels AI-generated.
    guidance: |
      "Dark, ancient, and foreboding" is the sound of a language model
      hedging. Pick your strongest adjective. Or use two. Or four.
      Three is the AI's security blanket.

  significance_tacking:
    budget: 0  # None. Ever.
    rule: Never end a sentence explaining why something matters.
    guidance: |
      LLMs can't resist explaining importance. Sentences ending in
      "...cementing her legacy" or "...highlighting the ongoing struggle"
      are machine-generated throat-clearing. Cut after the action.
      Trust the reader to understand significance from context.

  emotional_exposition:
    rule: DWELL in significant emotional moments. Don't tease—DELIVER.
    guidance: |
      When something matters emotionally, expand it. Statements like
      "This was different" or "Something shifted" are PROMISES. Pay off immediately:
      - What makes it different? Describe the specific quality.
      - Where is it felt in the body? Skin, chest, throat, gut?
      - What does it remind them of? What does it NOT remind them of?
      - What is the body doing in response? Tension releasing? Breath catching?
      Give the reader the EXPERIENCE, not just the label.

  metaphor_fatigue:
    rule: Keep metaphors FRESH. Same domain ≠ same metaphor.
    guidance: |
      Characters may have signature metaphor domains (a sailor thinks in knots
      and currents, a smith in heat and hammer). That's voice. The problem is
      REPETITION within the domain.
      Track what you've used. Same domain is fine. Same IMAGE is not.

  kill_words:
    # Classic AI tells
    - suddenly
    - somehow
    - seemed
    - orbs (for eyes)
    - ministrations
    - amidst
    - whilst
    - myriad
    - delve
    - tapestry
    - testament
    - beacon
    - vessel
    - journey (metaphorical)
    - visage
    - countenance
    - digits (for fingers)
    - tresses
    # Wikipedia-documented promotional adjectives
    - breathtaking
    - stunning
    - remarkable
    - extraordinary
    - exceptional
    - unparalleled
    - unprecedented
    - groundbreaking
    - cutting-edge
    - state-of-the-art
    - world-class
    - prestigious
    # Wikipedia-documented significance words
    - pivotal
    - crucial
    - profound
    - impactful
    - meaningful (as adjective)
    - transformative
    - monumental

  kill_patterns:
    # Classic AI patterns
    - "She realized that"
    - "It was as if"
    - "There was something about"
    - "heart pounded" (cliché)
    - "eyes [verbed]" (eyes don't act, faces do)
    - dialogue tags with adverbs
    - explaining emotion instead of showing
    # Wikipedia-documented verb substitution (use "is/are/has" instead)
    - "serves as a"
    - "acts as a"
    - "functions as a"
    - "stands as a"
    - "represents a"
    - "features a"
    - "offers a"
    - "boasts a"
    - "showcases a"
    # Wikipedia-documented "rich [noun]" pattern
    - "rich history"
    - "rich tapestry"
    - "rich heritage"
    - "rich tradition"
    - "rich legacy"
    # Wikipedia-documented "broader [noun]" pattern
    - "broader implications"
    - "broader context"
    - "broader significance"
    # Wikipedia-documented legacy patterns
    - "enduring legacy"
    - "lasting impact"
    - "indelible mark"
    - "stands the test of time"
    # Wikipedia-documented "plays a role" pattern
    - "plays a significant role"
    - "plays a crucial role"
    - "plays a pivotal role"
    - "plays an important role"
    # Wikipedia-documented significance-tacking (CUT these trailing phrases)
    - "emphasizing the importance of"
    - "highlighting the significance of"
    - "underscoring the need for"
    - "reflecting the continued relevance of"
    - "demonstrating the power of"
    - "showcasing the potential of"

  required_techniques:
    - body before interpretation
    - subtext in dialogue
    - sensory grounding in every scene
    - short sentences for impact, long for atmosphere

  dialogue_tags:
    preferred: [said, asked]
    acceptable: action beats instead of tags
    forbidden: adverb-laden tags

# Example passage in this voice (optional but helpful for calibration)
# example: |
#   She checked the inbox again ( the third time in ten minutes ) and the
#   *ache* behind her eyes sharpened. The cursor blinked. The fan hummed.
#   The coffee went cold.
#
#   Nothing.
#
#   The protocol was clear—wait for confirmation before proceeding—but
#   waiting had its own weight, accumulating in her shoulders like
#   something she'd have to carry out of here. She minimized the window.
#   Opened it again. The loop was running and she was inside it now,
#   checking … waiting … checking.
#
#   [ buffer full ]
#
#   She closed the laptop. Didn't help.
