  bonds: []                     # Relationships to NPCs
  secrets: []                   # Things even the player might not know yet
  momentum: null                # rising | peak | falling | stable

  # Physical appearance for VISUAL blocks (image generation)
  # NARRATOR references this for consistent character rendering
