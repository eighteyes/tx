# NPCs
npcs:
  example_npc:
    name: "The Innkeeper"

    # Physical appearance for VISUAL blocks
    appearance:
      age: "50s"
      ethnicity: "Eastern European"
      build: "stocky"
      hair: "graying, pulled back"
      distinguishing: ["flour-dusted apron", "wedding ring she keeps touching"]

    traits:
      - NERVOUS
      - PROTECTIVE
    bonds:
      - target: player
        type: suspicious_of
      - target: hidden_child
        type: protecting
    secrets:
      - "Hiding a child in the cellar"
      - "Witnessed the murder but won't speak"
    wants: "Keep the child safe"
    fears: "The investigators discovering the cellar"
    pressure: {}

    # Voice profile - how this character SOUNDS
    # Extract via Phase 6b of game-maker.md
    # voice:
