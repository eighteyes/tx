# Significant Objects (items with narrative weight)
objects:
  example_object:
    name: "The Letter"
    traits:
      - INCRIMINATING
      - WATER-DAMAGED
    secrets:
      - "Names the true murderer"
      - "The signature is forged"
    location: "hidden_in_floorboards"
