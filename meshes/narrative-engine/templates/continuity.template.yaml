# continuity.yaml — Oracle-focused campaign facts
# Copy this template to .ai/games/{game-id}/campaigns/{campaign-id}/continuity.yaml
#
# All writes go through campaign.sh — agents never edit this file directly.
# Oracle queries this file via campaign.sh for continuity checks.
#
# Schema: 6 top-level sections
#   established_facts  — locked facts that cannot be contradicted
#   revealed_secrets   — secrets with knowledge tracking (who knows, who doesn't)
#   knowledge_barriers — what characters DON'T know (dramatic irony tracking)
#   world_events       — external events that happened (consequences, environment)
#   appearances        — last-seen tracking per entity (when/where on-screen)
#   used_factoids      — narrator reuse tracking (prevent repetition)

# Established facts — things that HAPPENED and cannot be contradicted
# Oracle checks these before approving scene scripts
established_facts: []
  # - turn: 12
  #   fact: "Kaitlin blushed visibly in class"
  #   entities: [kaitlin, cohort]

# Revealed secrets — secrets with knowledge chain tracking
# Oracle uses these for KNOWLEDGE_CHAIN validation
revealed_secrets: []
  # - turn_established: 10
  #   secret: "Kaitlin's criminal record"
  #   known_by: [kaitlin]
  #   revealed_to:
  #     - character: heather
  #       turn: 47

# Knowledge barriers — what characters DON'T know
# Oracle catches unjustified knowledge claims against these
knowledge_barriers: []
  # - character: heather
  #   does_not_know: "Turn 10 orgasm context"
  #   dramatic_irony: true

# World events — external events that affected the campaign
# Architect queries these for consequence generation
world_events: []
  # - turn: 16
  #   event: "Marcus notices them entering together"
  #   category: consequence

# Appearances — last-seen tracking per entity
# Architect queries to detect who hasn't appeared recently
appearances: {}
  # marcus:
  #   last_turn: 47
  #   context: "WGS 412 classroom, noticed them entering together"
  # professor:
  #   last_turn: 47
  #   context: "Teaching, unaware"

# Used factoids — narrator reuse prevention
# Narrator checks before deploying real-world trivia or metaphors
used_factoids: []
  # - turn: 3
  #   factoid: "endorphin release"
  #   context: "used in intimacy scene"
