# continuity.yaml - Facts that CANNOT be contradicted
# Copy this template to .ai/games/{game-id}/campaigns/{campaign-id}/continuity.yaml
# Updated by SYSTEM after each turn. Loaded by NARRATOR and CAST before generating.
#
# The Continuity Ladder (higher = harder constraint):
# 1. CONSTRAINTS (setting.yaml) - Absolute
# 2. DEAD - Dead characters stay dead
# 3. WORLD_FACTS - Established through play
# 4. CHARACTER_FACTS - What's true about individuals
# 5. ITEM_STATE - Destroyed/damaged/possessed items
# 6. LOCATION_STATE - Destroyed/changed locations
# 7. TIMELINE - Event ordering
# 8. REVEALED_SECRETS - Who knows what
# 9. VOICE (entities.yaml) - Character sound
# 10. KNOWLEDGE_CHAIN - What was actually revealed vs assumed
# 11. IMPOSSIBLE - Unintentional physics violations

# World facts established through play
# These are LOCKED - violating them breaks continuity
world_facts: []
  # - fact: "The south gate was destroyed"
  #   established: 12
  #   cannot_contradict: "South gate cannot be used or mentioned as intact"

