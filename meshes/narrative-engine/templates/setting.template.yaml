# setting.yaml - World truths and atmosphere
# Copy this template to .ai/games/{game-id}/setting.yaml

# Source Material (if adapting a book/story)
source:
  title: ""                     # Book title, or "Original"
  chapter: null                 # Starting chapter/section
  divergence: ""                # How this game diverges from source

# Immutable World Facts
# These are ALWAYS true and affect outcome weights
truths:
  - "Magic exists but costs sanity"
  - "The king is dead, the throne contested"
  - "Winter has lasted three years"

# Genre Constraints
# These CANNOT happen - guardrails for outcome generation
constraints:
  - "No resurrection - death is permanent"
  - "No mind control - agency is sacred"
  - "Technology cannot exceed medieval level"

# Atmospheric Directive
# How NARRATOR should render scenes
atmosphere: |
  Dark fantasy. The world is weary, hope is scarce but stubborn.
  Colors are muted except for blood and fire. Speech is terse.
  Beauty exists in small moments - a shared meal, a kept promise.
  The supernatural is wrong, not wondrous.

# Locations
# Current and known places - adjacency defines valid movement
locations:
  current: "the_crossroads_inn"
  known:
    the_crossroads_inn:
      description: "A sagging timber building where three roads meet"
      truths:
        - "The fire never quite warms the corners"
        - "The innkeeper watches everyone"
      adjacent: ["inn_stable", "inn_upstairs", "crossroads"]
      present_entities:
        - player
        - innkeeper

    inn_stable:
      description: "Cold and dark, hay moldering in corners"
      truths:
        - "Something died here recently"
      adjacent: ["the_crossroads_inn", "crossroads"]
      present_entities: []

    inn_upstairs:
      description: "Creaking floorboards, three doors, one locked"
      truths:
        - "The locked room has no keyhole on this side"
      adjacent: ["the_crossroads_inn"]
      present_entities: []

    crossroads:
      description: "Where three muddy roads meet under grey sky"
      truths:
        - "A gallows stands at the center, empty"
      adjacent: ["the_crossroads_inn", "inn_stable", "north_road", "east_road", "south_road"]
      present_entities: []

# Transition Types
# Special movement that bypasses adjacency requirements
transition_types:
  walk: "Normal movement, must follow adjacency"
  dream: "No adjacency required, surreal logic applies"
  memory: "Flashback sequence, no physical movement"
  teleport: "Magical/supernatural transport, must be justified"
  montage: "Time skip with travel implied, describe journey briefly"
  cut: "Hard narrative cut, use sparingly for dramatic effect"

# Time
time:
  period: "Late evening"
  season: "Deep winter"
  elapsed: "Day 1"

# World Lexicon
# Invented terms, in-world slang, faction-specific vocabulary.
# All agents reference this for consistency — narrator uses these terms,
# scribe preserves them, calibrator extracts them.
lexicon: {}
  # {term}:
  #   meaning: "{definition}"
  #   usage: "{who says this, in what context}"
  #   register: "{formal | casual | slang | technical | sacred}"
  #
  # Examples:
  # bloodwine:
  #   meaning: "Fermented drink made from cave-fruit, deep red"
  #   usage: "Common among miners, served warm"
  #   register: casual
  # the_turning:
  #   meaning: "The cataclysm that ended the old world"
  #   usage: "Referenced by all characters, capitalized in speech"
  #   register: formal
  # scav:
  #   meaning: "Scavenger — someone who picks through wreckage for parts"
  #   usage: "Pejorative when used by station-born, neutral among belters"
  #   register: slang

# Genre Modules
# Load from references/genres/ for genre-specific extraction and guidance
# Most stories blend genres—list primary first, then secondary
genre_modules: []
  # - dark-fantasy      # Primary lens
  # - romance           # Secondary elements
  # - mystery           # Tertiary thread
