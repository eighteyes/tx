# Faction Entity Template
# Copy to: .ai/games/{game-id}/entities/factions/{faction-id}.yaml
# For organizations, groups, cults, guilds, families, etc.

id: faction-id
type: faction
name: "Faction Name"

# ============================================
# TRAITS - What this faction IS
# ============================================
traits:
  # Ideology - core beliefs/goals
  ideology: ""
    # Examples:
    # "Preserve the old ways at any cost"
    # "Technology will save humanity"
    # "The crown must fall"

  # Resources - what they have access to
  resources: []
    # Examples: [spies, gold, political_influence, weapons, safe_houses]

  # Methods - how they operate
  methods: []
    # Examples: [blackmail, assassination, bribery, propaganda, violence]

  # Structure - how they're organized
  structure: ""
    # Examples:
    # "Cell-based, no member knows more than two others"
    # "Traditional hierarchy with council of elders"
    # "Charismatic leader with fanatical followers"

  # Symbols - how they're recognized
  symbols:
    visual: []                  # [red hand mark, silver pin, specific tattoo]
    verbal: []                  # [code phrases, greetings]
    behavioral: []              # [always sit facing the door, never shake hands]

# ============================================
# EPISODES - What has happened to this faction
# ============================================
episodes: []
  # - turn: 4
  #   event: "Protagonist discovered their safe house"
  #   state_change:
  #     known_to_protagonist: true
  # - turn: 9
  #   event: "Leader assassinated, power vacuum created"
  #   state_change:
  #     power_level: declining
  #     internal_state: fractured

# ============================================
# CURRENT_STATE - Faction's present condition
# ============================================
current_state:
  stance_toward_protagonist: neutral  # hostile | suspicious | neutral | friendly | allied
  power_level: stable                 # rising | stable | declining | collapsed
  internal_state: unified             # unified | strained | fractured | civil_war
  known_to_protagonist: false         # has protagonist discovered they exist?
  active_operations: []               # ["Searching for the artifact", "Watching the inn"]

# Key members - named individuals (reference character entities)
key_members:
  leader: null                  # character-id
  known_agents: []              # [character-ids protagonist has encountered]

# Territory - where they operate
territory:
  stronghold: null              # location-id of main base
  influence_zones: []           # [location-ids where they have presence]

# Secrets - hidden aspects
secrets:
  true_goal: null               # "Actually protecting ancient evil from release"
  internal_conflicts: []        # ["Second in command plotting coup"]
  weaknesses: []                # ["Leader's daughter was exiled"]
