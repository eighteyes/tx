# bond.template.yaml
# First-class relationship entity between two characters
# Naming: alphabetical order ({char_a}_{char_b}, not {char_b}_{char_a})

id: "{character_a}_{character_b}"
entity_type: bond
participants: ["{character_a}", "{character_b}"]

# 12-dimensional measurement (each 0-5)
# Asymmetry notation: {a: N, b: N} when experiences differ
dimensions:
  physical: 0
  emotional: 0
  intellectual: 0
  trust: 0
  sexual: 0
  public: 0
  power: 0
  familiarity: 0
  loyalty: 0
  fear: 0
  obligation: 0
  hope: 0

baseline: {}           # Prose per dimension — what is settled vs. frontier
established: {}        # Per-dimension moment log

# Bond-specific traits (how the relationship manifests)
traits:
  evolved:
    "{TRAIT_NAME}": {pressure: {N}}
  voices:
    "{TRAIT_NAME}":
      speaks_as: "{how this bond dynamic voices itself}"

# Bond history (full record)
episodes:
  - turn: {N}
    event: "{what happened to the bond}"
    dimension_changes: "{dimension}: {before} -> {after}"
