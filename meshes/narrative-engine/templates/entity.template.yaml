# entity.template.yaml
# Lean entity schema - minimal, canonical, no redundancy
#
# Entity Types:
# - character → entities/characters/
# - location → entities/locations/
# - item → entities/items/
# - faction → entities/factions/
# - world-rule → entities/world-rules/
# - bond → entities/bonds/ (see bond.template.yaml)

id: "{entity-id}"
entity_type: "{character|location|item|faction|world-rule}"
name: "{Human Readable Name}"

# TRAITS - Stable properties
# What this entity IS at its core. Scribe should NEVER modify.
traits:
  base: []
    # Original, unchanging traits
    # Examples: [cautious, loyal, enchanted, ancient]

  evolved: {}
    # Traits that have evolved through play
    # Format: TRAIT_NAME: {from: BASE_TRAIT, pressure: N}
    # Examples:
    #   MERCILESS_CLARITY: {from: INTELLIGENT, pressure: 6}
    #   DESPERATE: {pressure: 5}

  voices: {}
    # How evolved traits speak (for characters)
    # Format:
    #   TRAIT_NAME:
    #     speaks_as: "The voice's characteristic speech"

# LAYERS - Progressive disclosure
# Details revealed over time. Layer placement is SEMANTIC (visibility).
layers:
  first_glance: []
    # Immediately visible on first encounter
  familiar: []
    # Noticed on repeat exposure
  intimate: []
    # Revealed through time/trust/events

# BONDS - References to bond entities
# Full bond data lives in entities/bonds/{a_b}.yaml
bonds: []
  # Format: ["{bond_id}", "{bond_id}"]
  # Example: ["{char_a}_{char_b}", "{char_b}_{char_c}"]

# EPISODES - Event history (full record, append only)
# Critical for trait evolution tracking. Never truncate.
episodes: []
  # Format:
  # - turn: N
  #   event: "Brief description"
  #   trait_changes: {TRAIT: pressure_delta}
  #   state_change: {key: value}

# REMOVED in lean schema:
# - current_state.trait_pressures (compute from traits.evolved)
# - current_state.bond_X (read from bond entity)
# - internal_state prose blobs (redundant with episodes)
# - detailed current_state fields (derive from episodes[-1])
