# arc.yaml - Dramatic questions and narrative pressure
# Copy this template to .ai/games/{game-id}/arc.yaml

# Overall Arc Pressure (0-100)
# At 80+, questions push toward resolution
pressure: 0

# Active Dramatic Questions
# These are tensions seeking resolution - not plot, but gravitational wells
questions:
  - id: "q1"
    question: "Who killed the merchant?"
    type: mystery                 # mystery | loyalty | survival | identity | power
    pressure: 0                   # Individual question pressure
    status: active                # active | dormant | answered
    stakes: "The wrong person may hang"

  - id: "q2"
    question: "Will the innkeeper's secret be discovered?"
    type: survival
    pressure: 0
    status: active
    stakes: "A child's life hangs in the balance"

# Answered Questions (for history)
# Once resolved, they become setting truths
answered:
  # - id: "q0"
  #   question: "Did they reach the inn before nightfall?"
  #   answer: "Yes, but barely"
  #   consequence: "Added to truths: 'Something followed them from the forest'"

# Scene Momentum
# Current scene's energy state
scene:
  momentum: rising                # rising | peak | falling | stable
  active_question: "q1"           # Which question this scene orbits
  tension_points: []              # Moments of escalation this scene

# Pressure Thresholds
thresholds:
  question_resolution: 80         # Question pressure needed to force resolution
  arc_climax: 90                  # Overall pressure for major story turn
  trait_evolution: 5              # Uses before trait evolves

# Possible Endings
# Terminus states discovered through play or seeded initially
# These are possibilities, not prescriptions—play maps which paths lead here
possible_endings: []
  # - name: "The Reckoning"
  #   description: "Truth exposed, consequences faced"
  #   tone: bittersweet            # triumphant | tragic | bittersweet | ambiguous | quiet
  #   requirements: "Major secret must be revealed publicly"
  #   discovered_in: null          # null if seeded, campaign-id if discovered

# Forbidden Endings
# Terminus states that would betray the story's core
forbidden_endings: []
  # - "Protagonist becomes what they fought against without recognition"
  # - "Deus ex machina resolution"

# ============================================
# ENDING AVAILABILITY (Runtime - set by DRAMATURG)
# ============================================
# When conditions are met, DRAMATURG sets this flag.
# NARRATOR surfaces the off-ramp in "You could:" options.
# Player ignores it → story continues. Player takes it → epilogue.

ending:
  available: false
  type: null                    # arc_complete | tragedy | triumph | exhaustion | quiet
  trigger: null                 # What made this ending available
  prompt: null                  # Text for NARRATOR to offer
  # Example when active:
  # available: true
  # type: arc_complete
  # trigger: "All dramatic questions resolved"
  # prompt: "The questions are answered. You could let the story rest here."

# Ending Conditions (evaluated by DRAMATURG each turn)
ending_conditions:
  arc_complete:
    description: "All major questions answered, arc pressure released"
    requires:
      - "All questions with pressure > 50 are status: answered"
      - "arc_pressure < 30 (tension released)"
    tone: quiet

  triumph:
    description: "Transformational success on climactic action"
    requires:
      - "outcome_type: transformational"
      - "arc_pressure >= 80 (climactic moment)"
    tone: triumphant

  tragedy:
    description: "Catastrophic outcome with no recovery path"
    requires:
      - "outcome_type: catastrophic"
      - "protagonist status: dead OR all bonds severed OR core goal destroyed"
    tone: tragic

  exhaustion:
    description: "Player signals fatigue, story offers graceful exit"
    requires:
      - "Player explicitly requests ending"
      - "OR 3+ turns of lateral movement (no question pressure change)"
    tone: ambiguous

  quiet:
    description: "Natural pause point, nothing demands continuation"
    requires:
      - "arc_pressure between 20-40"
      - "No questions above pressure 60"
      - "Scene momentum: stable"
    tone: bittersweet

# Epilogue Seeds (used when ending is taken)
epilogue_seeds: []
  # - "What became of the artifact"
  # - "Whether the innkeeper's secret held"
  # - "The child, years later"
