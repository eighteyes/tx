# UNIVERSE LEXICON (LOCKED - Calibration 2026-03-03)
# ═══════════════════════════════════════════════════════════

lexicon:
  frayel_kinship:
    Hands: |
      What Frayel call their caretakers. Somatic — the first touch after
      emerging from the vat. Intimate but plural. Never one person.
      "Her Hands used to say..." / "the Hands that raised her" /
      "gentle hands, rough hands, all the hands that shaped her."
    batch_siblings: "Frayel from the same vat cohort. Closest equivalent to siblings."
    vat_cohort: "All Frayel grown in the same generation/batch cycle."

    forbidden_terms:
      - "mother" # no biological parents
      - "father"
      - "parents"
      - "family" # in biological sense — use batch-siblings, vat-cohort

  belt_slang:
    grub_barge: |
      Belt slang for food delivery ships. Dismissive. What miners call it.
      "A combat system running a grub barge" — that's the wound.
    slop_runner: "Working class, slightly degrading. The way Test would say it."
    chow_hauler: "Military-adjacent. Less dismissive than grub barge."
    ration_run: "The job, not the ship. 'Running rations to rock-hoppers.'"
    rock_hopper: "Belt miner. Not quite derogatory, but close."

    forbidden_terms:
      - "food truck" # Earth anachronism
      - "food ship" # too generic, use grub barge

  oracle_lint_rules:
    - pattern: "food truck"
      severity: error
      message: "Anachronism. Use 'grub barge' or 'chow hauler' for belt food delivery."
    - pattern: "\\bmother\\b"
      context: "Frayel character backstory"
      severity: error
      message: "Frayel are vat-grown. Use 'Hands' for caretakers."
    - pattern: "\\b(mom|dad|parents|father)\\b"
      context: "Frayel character backstory"
      severity: error
      message: "Frayel are vat-grown. No biological parents. Use 'Hands', 'batch-siblings', 'vat-cohort'."
