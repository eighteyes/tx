texture:
  the_belt: "Frontier space. Everyone's running from something or toward something."
  the_ship: "Home, partner, liability. The only thing that's really hers."
  the_prejudice: "Systemic, exhausting, sometimes violent. Not every baseline is awful."
  the_hope: "Persistent against evidence. Maybe this port. Maybe this job. Maybe."
  the_telepathy: "A wound that sometimes functions as a gift."

