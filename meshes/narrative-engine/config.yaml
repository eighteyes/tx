# narrative-engine/config.yaml
# LLM-Native Tabletop RPG System
# No stats. No HP. Pure semantic mechanics.

mesh: narrative-engine
description: "Statless RPG where traits are semantically weighted, damage is trait accumulation, and outcomes emerge from JIT probability tables + external entropy"

agents:
  - name: system
    model: sonnet
    prompt: system/prompt.md

  - name: narrator
    model: opus
    prompt: narrator/prompt.md

  - name: cast
    model: sonnet
    prompt: cast/prompt.md

entry_point: narrator
completion_agent: narrator

# NARRATOR orchestrates via ask/ask-response pattern
# SYSTEM and CAST respond to NARRATOR's queries
routing:
  narrator:
    complete:
      core: "Scene rendered, awaiting player input"
    blocked:
      core: "Cannot proceed - need clarification"
  system:
    complete:
      narrator: "Mechanical resolution complete"
  cast:
    complete:
      narrator: "Character responses ready"

# Game state lives here
workspace:
  path: ".ai/games/{game-id}/"

# Turn workspace for collaborative agent synthesis
turn_workspace:
  path: ".ai/games/{game-id}/campaigns/{campaign-id}/turns/"
  create_on_init: true
  cleanup_on_complete: false  # Keep for history/replay

# Transparency for debugging mechanics
rearmatter:
  enabled: true
  fields:
    - outcome_table      # What possibilities were generated
    - selected_outcome   # What RNG chose
    - trait_pressure     # Current pressure on traits
    - momentum           # Scene momentum state
    - arc_pressure       # How close to arc resolution
