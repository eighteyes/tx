# narrative-engine/config.yaml
# LLM-Native Tabletop RPG System - Coordinator Architecture
# Separates orchestration (haiku) from creative work (opus/sonnet)

mesh: narrative-engine
description: "Statless RPG with coordinator pattern. Traits are semantically weighted, damage is trait accumulation, outcomes emerge from JIT probability tables + external entropy."

agents:
  - name: coordinator
    model: haiku
    prompt: coordinator/prompt.md
    # State machine, routing, entropy, file management
    # Does NOT do creative work

  - name: dramaturg
    model: haiku
    prompt: dramaturg/prompt.md
    # Story-aware outcome suggestions
    # Reads arc context, suggests weight adjustments

  - name: system
    model: sonnet
    prompt: system/prompt.md
    # Mechanics engine, outcome tables, trait tracking
    # Accepts dramaturg notes for story-aware weighting

  - name: cast
    model: sonnet
    prompt: cast/prompt.md
    # NPC voices, reactions, character consistency

  - name: scene-crafter
    model: haiku
    prompt: scene-crafter/prompt.md
    # Scene structure, beats, transitions, pacing
    # Identifies decision points for player agency

  - name: narrator
    model: opus
    prompt: narrator/prompt.md
    # Prose rendering with staged build (1.5-2k words)
    # Orchestrates dramaturg, system, cast, scene-crafter
    # Handles mid-turn player decisions

  - name: oracle
    model: haiku
    prompt: oracle/prompt.md
    # Continuity validation against established facts

  - name: editor
    model: sonnet
    prompt: editor/prompt.md
    # Adversarial prose review against author.yaml
    # Only fires if oracle passes

  - name: scribe
    model: haiku
    prompt: scribe/prompt.md
    # Context compression, state management, game canon promotion
    # Only fires if editor passes (or max iterations)

entry_point: coordinator
completion_agent: coordinator

# Session persistence (only coordinator tracks state across turns)
continuation:
  - coordinator

# Phase-based routing with direct agent communication
# Phase 1: DRAMATURG + SCENE-CRAFTER (prep)
# Phase 2: NARRATOR + SYSTEM + CAST (render)
# Phase 3: EDITOR + NARRATOR (review loop - editor leads)
# Coordinator kicks off each phase, agents communicate directly within phase

routing:
  coordinator:
    ask:
      narrator: "Render prose (phase 2)"
      editor: "Review prose (phase 3 - editor leads revision loop)"
      oracle: "Validate continuity"
      scribe: "Compress turn state"
    ask-human:
      core: "Need player input OR game state anomaly"
    complete:
      core: "Turn complete, prose delivered"

  narrator:
    ask:
      dramaturg: "Analyze story context"
      system: "Need mechanical resolution"
      cast: "Need character reactions"
      scene-crafter: "Outline scene structure"
    ask-human:
      core: "HITL extraction / mid-turn decisions"
    ask-response:
      coordinator: "Initial prose rendered"
      editor: "Revised prose ready"  # Direct response to editor in phase 3

  dramaturg:
    ask-response:
      narrator: "Story analysis complete"

  system:
    ask-response:
      narrator: "Mechanical resolution complete"

  cast:
    ask-response:
      narrator: "Character reactions ready"

  scene-crafter:
    ask-response:
      narrator: "Scene outline complete"

  oracle:
    ask-response:
      coordinator: "Continuity validation complete"

  editor:
    ask:
      narrator: "Fix violations"  # Direct ask to narrator for revisions
    ask-response:
      coordinator: "Review complete (CLEAN or max iterations)"

  scribe:
    ask-response:
      coordinator: "Turn compression complete"

# Editor manages its own iteration loop (max 3)
# Coordinator only sees: phase started → phase complete

# Workspace configuration
# Base workspace for agents (doesn't require game context)
workspace:
  path: ".ai/tx/narrative-engine/"
  create_on_init: false  # Agents create their own paths based on session

# Turn workspace template (resolved after game exists)
turn_workspace:
  path: ".ai/games/{game-id}/campaigns/{campaign-id}/turns/"
  create_on_init: false  # Coordinator creates after game-id known
  cleanup_on_complete: false

