# narrative-engine/config.yaml
# LLM-Native Tabletop RPG System - Phase Coordinator Architecture
# Splits orchestration into discrete haiku phase coordinators

mesh: narrative-engine
description: "Statless RPG with coordinator pattern. Traits are semantically weighted, damage is trait accumulation, outcomes emerge from JIT probability tables + external entropy."

agents:
  # ==========================================
  # PHASE COORDINATORS (sonnet - precise routing)
  # ==========================================

  - name: entry
    model: sonnet
    prompt: coordinator/entry.md

  - name: game-coord
    model: sonnet
    prompt: coordinator/game-coord.md

  # RETIRED: prologue-coord — calibrator routes directly to narrator for prologue rendering
  # - name: prologue-coord
  #   model: sonnet
  #   prompt: coordinator/prologue-coord.md

  - name: init-turn
    model: sonnet
    prompt: coordinator/init-turn.md
    # Renamed from init-coord — creates workspace, validates action coherence

  # RETIRED: prep-coord replaced by direct agent chain routing + state-discovery.sh
  # - name: prep-coord
  #   model: sonnet
  #   prompt: coordinator/prep-coord.md

  # RETIRED: render-coord — editor routes directly to scribe + visual
  # - name: render-coord
  #   model: sonnet
  #   prompt: coordinator/render-coord.md

  # RETIRED: validate-coord — oracle branches directly (approved → narrator, violations → scene-crafter)
  # - name: validate-coord
  #   model: sonnet
  #   prompt: coordinator/validate-coord.md

  # RETIRED: compress-coord — scribe is now completion_agent, routes to core directly
  # - name: compress-coord
  #   model: sonnet
  #   prompt: coordinator/compress-coord.md

  # ==========================================
  # CREATIVE AGENTS (sonnet/opus)
  # ==========================================
  - name: dramaturg
    model: sonnet
    prompt: dramaturg/prompt.md
    # phase 1 - Story-aware outcome suggestions
    # Reads arc context, suggests weight adjustments

  - name: fates
    model: sonnet
    prompt: fates/prompt.md
    # phase 1 - World agency, entropic world events
    # Generates branching possibility tree (no weights)

  - name: possibility
    model: sonnet
    prompt: possibility/prompt.md
    # phase 1 - Entropy synthesis
    # Reads fates + dramaturg, assigns probability weights

  - name: scene-crafter
    model: sonnet
    prompt: scene-crafter/prompt.md
    # phase 1 - Scene structure, beats, transitions, pacing
    # Identifies decision points for player agency

  - name: dialogue
    model: sonnet
    prompt: dialogue/prompt.md
    # phase 2 - Character voice specialist
    # Drafts dialogue for each exchange beat with delivery/subtext

  - name: system
    model: sonnet
    prompt: system/prompt.md
    # phase 2 - Mechanics engine, outcome tables, trait tracking
    # Accepts dramaturg notes for story-aware weighting

  - name: cast
    model: sonnet
    prompt: cast/prompt.md
    # phase 2 - NPC voices, reactions, character consistency

  - name: narrator
    model: opus
    prompt: narrator/prompt.md
    # phase 2,3 - Prose rendering with staged build (1.5-2k words)
    # Orchestrates system, cast, lint/edit cycle
    # Receives fully-decided outline from scene-crafter

  - name: calibrator
    model: opus
    prompt: calibrator/prompt.md
    # Game creation - HITL worldbuilding extraction
    # 9-phase extraction loop via HITL messages to core
    # Creates author.yaml, setting.yaml, arc.yaml, entities
    # Hands off to narrator for prologue when complete

  - name: editor
    model: opus
    prompt: editor/prompt.md
    # Adversarial prose review against author.yaml
    # Works with narrator in phase 3

  - name: prose-eval
    model: haiku
    prompt: prose-eval/prompt.md
    # Post-editor evaluation gate — scores prose against 5-dimension rubric
    # Never fixes, only evaluates. Routes to visual on pass, editor on fail (once)

  - name: visual
    model: sonnet
    prompt: visual/prompt.md
    # Multi-beat emotional visualization
    # Reads prose.md, generates style variants per beat

  - name: oracle
    model: sonnet
    prompt: oracle/prompt.md
    # Continuity validation + knowledge queries for entity data

  - name: scribe
    model: sonnet
    prompt: scribe/prompt.md
    # Context compression, state management, game canon promotion
    # Only fires if oracle passes (or max iterations)

  # ==========================================
  # LINT LADDER - Parallel mechanical linters
  # ==========================================
  # RETIRED: lint-coordinator — narrator inits violations.yaml, last linter routes to editor
  # - name: lint-coordinator
  #   model: sonnet
  #   prompt: linters/lint-coordinator.md

  - name: lint-forbidden-words
    model: haiku
    prompt: linters/forbidden-words.md
    # Mechanical: "suddenly", "seemed", "very", etc.
    # Concordance overuse detection

  - name: lint-patterns
    model: haiku
    prompt: linters/patterns.md
    # Pattern-matching: "She realized", "Fear washed over", etc.
    # Downgraded from sonnet — detection against known pattern list

  - name: lint-ai-tells
    model: haiku
    prompt: linters/ai-tells.md
    # Mechanical: "amidst", "whilst", "orbs", etc.
    # Simple word swaps

  - name: lint-cadence
    model: haiku
    prompt: linters/cadence.md
    # Mechanical: Sentence length distribution + monotony thresholds
    # Downgraded from sonnet — counting and threshold comparison

  - name: lint-metrics
    model: haiku
    prompt: linters/lint-metrics.md
    # Computational: FK readability, sentence variance, coherence, dialogue ratio
    # Runs compute-metrics.sh — pure text processing, no LLM judgment

  - name: lint-dialogue
    model: haiku
    prompt: linters/dialogue.md
    # Mechanical: Tags, adverbs
    # Coherence check

  - name: lint-litotes
    model: sonnet
    prompt: linters/litotes.md
    # Creative: "not X, but Y" patterns
    # Budget: 1-2 per scene

  - name: lint-metaphor
    model: sonnet
    prompt: linters/metaphor.md
    # Creative: Repeated sensory channels
    # One peak expression per channel per scene

  - name: lint-body-first
    model: haiku
    prompt: linters/body-first.md
    # Mechanical: Scene opening classification (physical/thought/emotion)
    # Downgraded from sonnet — first-line pattern classification

  - name: lint-factoids
    model: haiku
    prompt: linters/lint-factoids.md
    # Creative: Real-world trivia repetition detection
    # Prevents same facts appearing twice in campaign

  - name: lint-temporal
    model: haiku
    prompt: linters/lint-temporal.md
    # Creative: Temporal continuity detection
    # Duration/time contradictions across turns

entry_point: entry

# Two completion agents for different workflows (first-wins):
# - game-coord: New Game workflow ends after calibration
# - scribe: Write Turn workflow ends after scribe sends completion
completion_agents:
  - game-coord
  - scribe

# Session continuation: reuse Claude session IDs within a mesh run (default: true)
continuation: true
# Session persistence: keep sessions across mesh runs (default: false)
# persistence: true

# ==========================================
# ROUTING - Phase coordinator architecture
# ==========================================

routing:
  # All agent communication uses 'message' type.
  # Messages to core/core are implicitly HITL (session pauses).
  # The system infers routing from destination.
  #
  # Phase flow: entry → game-coord|init-turn → entropy-architect/architect → scene-sim/simulator → oracle ⇄ scene-sim/simulator → narrator → linters → editor → prose-eval → visual → scribe → core
  # (Old chain v1: init-turn → fates → dramaturg → possibility → system → cast → scene-crafter → oracle → dialogue → narrator)
  # (Old chain v2: entropy-architect → cast → scene-crafter → oracle → dialogue → narrator)
  # Prep chain: direct agent-to-agent routing, no coordinator. Recovery via state-discovery.sh --next

  # Phase coordinators
  entry:
    message:
      game-coord: "Route new game or edit game request"
      init-turn: "Route player action"
      narrator: "Recovery: resume prologue (check prologue.md absence) | resume render phase"
      dramaturg: "Recovery: resume prep phase (state-discovery.sh routes to correct agent)"
      oracle: "Recovery: resume validation"
      scribe: "Recovery: resume compression"
      core: "Turn in progress OR message-state confusion"

  game-coord:
    message:
      calibrator: "HITL game creation"
      core: "New game calibration complete"

  # RETIRED: prologue-coord — calibrator routes directly to narrator
  # prologue-coord:
  #   message:
  #     dramaturg: "Prologue workspace ready"

  init-turn:
    message:
      entropy-architect/architect: "Turn workspace ready — action locked"
      # FALLBACK: Original 4-agent chain (uncomment fates, comment entropy-architect to revert)
      # fates: "Turn workspace ready — action locked"

  # RETIRED: validate-coord — oracle routes directly (approved → narrator, violations → scene-crafter)
  # validate-coord:
  #   message:
  #     oracle: "Validate continuity"
  #     scene-crafter: "Fix outline violations"
  #     narrator: "Scene approved → render prose"

  # ==========================================
  # CREATIVE AGENT ROUTING
  # ==========================================

  calibrator:
    message:
      core: "HITL extraction / worldbuilder tuning | Session complete"
      narrator: "Game creation complete — render prologue"

  narrator:
    message:
      oracle: "Knowledge query"
      lint-forbidden-words: "Lint prose — start lint chain directly"
      scribe: "Prologue complete — finalize and deliver"

  fates:
    message:
      dramaturg: "World branches written → analyze story position"
      scene-crafter: "Table-extend complete — subtable added to entropy-tables.yaml"

  dramaturg:
    message:
      possibility: "Outcome shapes ready → synthesize weights"
      scene-crafter: "Table-extend complete — mechanical notes added"

  possibility:
    message:
      system: "Entropy tables ready → resolve mechanics"

  system:
    message:
      cast: "Mechanical resolution complete → generate reactions"

  # DORMANT: cast routing (absorbed into scene-sim/simulator)
  # cast:
  #   message:
  #     scene-crafter: "Character reactions ready → design scene beats"

  # DORMANT: scene-crafter routing (absorbed into scene-sim/simulator)
  # scene-crafter:
  #   message:
  #     core: "Mid-turn player decisions"
  #     oracle: "Scene outline complete → validate continuity"
  #     fates: "Table-extend OR micro-table request — new subtable or micro-injection"
  #     dramaturg: "Table-extend request — add mechanical notes to new subtable"

  oracle:
    message:
      narrator: "Continuity approved → render prose"
      scene-sim/simulator: "Continuity violations → fix scene script"
      # DORMANT: dialogue routing (replaced by scene-sim pipeline)
      # dialogue: "Continuity approved → draft character voices"
      # scene-crafter: "Continuity violations → fix outline"

  # DORMANT: dialogue routing (absorbed into scene-sim/simulator)
  # dialogue:
  #   message:
  #     narrator: "Dialogue drafted → render prose"

  scribe:
    message:
      core: "Turn complete — prose + rearmatter delivered"

  # ==========================================
  # LINT LADDER ROUTING
  # ==========================================

  # Lint chain: narrator dispatches first linter, each passes to the next.
  # Final linter routes directly to editor.
  lint-forbidden-words:
    message:
      lint-patterns: "Next lint"

  lint-patterns:
    message:
      lint-ai-tells: "Next lint"

  lint-ai-tells:
    message:
      lint-cadence: "Next lint"

  lint-cadence:
    message:
      lint-metrics: "Next lint"

  lint-metrics:
    message:
      lint-dialogue: "Next lint"

  lint-dialogue:
    message:
      lint-litotes: "Next lint"

  lint-litotes:
    message:
      lint-metaphor: "Next lint"

  lint-metaphor:
    message:
      lint-body-first: "Next lint"

  lint-body-first:
    message:
      lint-factoids: "Next lint"

  lint-factoids:
    message:
      lint-temporal: "Next lint"

  lint-temporal:
    message:
      editor: "Lint chain complete → review violations"

  # ==========================================
  # EDITOR
  # ==========================================

  editor:
    message:
      prose-eval: "Prose finalized → evaluate quality"

  prose-eval:
    message:
      visual: "Prose evaluation passed → generate visual beats"
      editor: "Prose evaluation failed → revision needed (once only)"

  visual:
    message:
      scribe: "Visual beats complete → compress and complete"

# ==========================================
# MANIFEST ENFORCEMENT
# ==========================================

manifest_enforcement:
  post_validation: true
  pre_validation: true
  max_retry: 2

# ==========================================
# GUARDRAILS
# ==========================================

guardrails:
  routing_error:
    routing_retry_max: 3
    routing_fallback: entry
  max_messages:
    limit: 3
  agents:
    init-turn:
      routing_error:
        strict: true
    scene-crafter:
      max_messages:
        limit: 5
    editor:
      max_messages:
        limit: 5

# ==========================================
# MANIFEST - File-centric I/O manifest (source of truth)
# ==========================================

manifest:
  # --- Session State ---
  - id: session.yaml
    description: Coordinator handoff state persisted across turns
    location: session
    persistent: true
    reads: [entry, game-coord, init-turn, scribe, calibrator]
    writes: [entry, game-coord, init-turn, scribe, calibrator]

  # --- Turn Workspace (per-turn artifacts) ---
  - id: context.yaml
    description: Turn context seeded by coordinator, consumed by creative agents
    location: workspace
    reads: [dramaturg, system, cast, scene-crafter, narrator, scribe, fates, possibility, dialogue, entropy-architect/architect, scene-sim/simulator]
    writes: [init-turn]

  - id: intent.yaml
    description: Single source for player action — raw input, clarified intent, hopes, off-table outcomes
    location: workspace
    reads: [fates, dramaturg, possibility, system, cast, scene-crafter, narrator, entropy-architect/architect, scene-sim/simulator, prose-eval]
    writes: [init-turn]

  - id: action-lock.yaml
    description: Locked player action — ground truth, not subject to entropy
    location: workspace
    reads: [fates, dramaturg, possibility, system, scene-crafter, narrator, entropy-architect/architect, scene-sim/simulator, prose-eval]
    writes: [init-turn]

  - id: dramaturg-notes.yaml
    description: Story analysis and outcome shapes (no weights)
    location: workspace
    reads: [possibility, system, scene-crafter, narrator, scribe, scene-sim/simulator]
    writes: [dramaturg, entropy-architect/architect]

  - id: fates.yaml
    description: World possibility branching tree (no weights)
    location: workspace
    reads: [possibility, system, cast, scene-crafter, narrator, scribe, visual]
    writes: [fates, entropy-architect/architect]

  - id: entropy-tables.yaml
    description: Weighted probability tables synthesized from fates + dramaturg
    location: workspace
    reads: [system, scene-crafter, fates, dramaturg, entropy-architect/architect, scene-sim/simulator]
    writes: [possibility, fates, dramaturg, entropy-architect/architect]

  - id: entropy-selection.yaml
    description: Resolved entropy outcomes from primary + subtable rolls
    location: workspace
    reads: [scene-crafter, narrator, scribe]
    writes: [system]

  - id: resolution.yaml
    description: Mechanical outcome tables and trait resolution
    location: workspace
    reads: [system, cast, scene-crafter, narrator, scribe, scene-sim/simulator]
    writes: [system, entropy-architect/architect]

  # DORMANT: reactions.yaml (absorbed into scene-sim/simulator → scene_script.yaml)
  # - id: reactions.yaml
  #   description: NPC reactions and character voice responses
  #   location: workspace
  #   reads: [scene-crafter, narrator, scribe, oracle, dialogue]
  #   writes: [cast]

  # DORMANT: scene-outline.yaml (replaced by scene_script.yaml from scene-sim)
  # - id: scene-outline.yaml
  #   description: Scene beats, pacing, and decision points
  #   location: workspace
  #   reads: [narrator, oracle, visual, scribe, dialogue]
  #   writes: [scene-crafter]

  # DORMANT: dialogue.yaml (absorbed into scene-sim/simulator → scene_script.yaml)
  # - id: dialogue.yaml
  #   description: Character-specific dialogue drafts with delivery notes and subtext
  #   location: workspace
  #   reads: [narrator]
  #   writes: [dialogue]

  - id: scene_script.yaml
    description: Beat-by-beat scene script with voices, time progression, prop tracking, pacing. Produced by scene-sim/simulator.
    location: workspace
    reads: [narrator, oracle, visual, scribe, prose-eval]
    writes: []  # Written by scene-sim/simulator (cross-mesh)

  - id: prose-draft.md
    description: Working prose draft iterated through lint/edit cycle
    location: workspace
    reads: [narrator, editor, lint-metrics]
    writes: [narrator, editor]

  - id: prose.md
    description: Final approved prose output for the turn
    location: workspace
    reads: [scribe, visual, narrator, prose-eval]
    writes: [editor]

  - id: visual.yaml
    description: Multi-beat emotional visualization briefs with style variants
    location: workspace
    reads: [scribe]
    writes: [visual]

  - id: concordance.txt
    description: Per-turn word frequency extract for overuse detection
    location: workspace
    reads: [lint-forbidden-words]
    writes: [narrator]

  - id: dialogue-pairs.txt
    description: Extracted dialogue tag/line pairs for lint analysis
    location: workspace
    reads: [lint-dialogue]
    writes: [narrator]

  - id: violations.yaml
    description: Aggregated lint violations for editor review
    location: workspace
    reads: [editor, lint-metrics, prose-eval, scribe]
    writes: [narrator, lint-metrics, prose-eval]

  - id: summary.md
    description: Compressed turn summary for context window management
    location: workspace
    reads: [dramaturg]
    writes: [scribe]

  # RETIRED: closing.yaml — replaced by scene.yaml (campaign-level, single source of truth)
  # - id: closing.yaml
  #   description: Canonical physical state at turn end for next turn continuity
  #   location: workspace
  #   reads: [init-turn, narrator]
  #   writes: [scribe]

  - id: calibration-state.yaml
    description: HITL calibration extraction progress tracker
    location: workspace
    reads: [calibrator]
    writes: [calibrator]

  # --- Game Root ---
  - id: author.yaml
    description: Author voice profile and stylistic constraints
    location: game
    persistent: true
    reads: [narrator, scene-crafter, editor, visual, calibrator, entropy-architect/architect, scene-sim/simulator, lint-metrics, prose-eval]
    writes: [calibrator]

  - id: setting.yaml
    description: World setting, geography, tone, and genre parameters
    location: game
    persistent: true
    reads: [narrator, oracle, fates, calibrator, entropy-architect/architect]
    writes: [calibrator]

  - id: entities.yaml
    description: Master entity index with traits, relationships, status
    location: game
    persistent: true
    reads: [dramaturg, system, narrator, oracle, scribe, fates, calibrator]
    writes: [scribe, calibrator]

  - id: entities/characters/
    description: Individual character entity files (traits, bonds, state)
    location: game
    persistent: true
    reads: [init-turn, system, cast, narrator, oracle, scribe, fates, possibility, dramaturg, calibrator, dialogue, visual, entropy-architect/architect, scene-sim/simulator]
    writes: [scribe, calibrator]

  - id: entities/bonds/
    description: Bond entity files (relationship intensity, dynamics)
    location: game
    persistent: true
    reads: [fates, possibility, cast, dramaturg, scribe, entropy-architect/architect, scene-sim/simulator]
    writes: [scribe, calibrator]

  - id: story-corpus.txt
    description: Append-only full prose archive across all turns
    location: game
    persistent: true
    reads: []
    writes: [scribe]

  - id: story-concordance.txt
    description: Cumulative word frequency data for cross-turn overuse detection
    location: game
    persistent: true
    reads: [lint-forbidden-words]
    writes: [scribe]

  # --- Campaign State ---
  - id: arc.yaml
    description: Story arc structure, act progression, and tension curves
    location: campaign
    persistent: true
    reads: [dramaturg, scene-crafter, system, narrator, scribe, fates, calibrator, entropy-architect/architect]
    writes: [scribe, calibrator]

  - id: turns/
    description: Turn workspace directories (init-turn creates new turn dirs)
    location: campaign
    reads: [init-turn, entry]
    writes: [init-turn, entry]

  # RETIRED: state.yaml — replaced by scene.yaml (campaign-level, single source of truth)
  # - id: state.yaml
  #   description: Campaign mechanical state — active effects, conditions, resources
  #   location: campaign
  #   persistent: true
  #   reads: [init-turn, dramaturg, system, scribe, fates]
  #   writes: [init-turn, scribe]

  - id: scene.yaml
    description: Canonical scene state — location, closing positions, arc pressure, time. Replaces closing.yaml + state.yaml.
    location: campaign
    persistent: true
    reads: [init-turn, fates, dramaturg, possibility, scene-crafter, entropy-architect/architect, scene-sim/simulator]
    writes: [scribe]

  - id: trajectories.yaml
    description: Committed futures with timers (Chekhov's Guns)
    location: campaign
    persistent: true
    reads: [fates, entropy-architect/architect]
    writes: [scribe]

  - id: timeline.yaml
    description: Canonical time tracking — day counter, time skips, elapsed time
    location: campaign
    persistent: true
    reads: [narrator, dramaturg, entropy-architect/architect]
    writes: [scribe]

  - id: continuity.yaml
    description: Canonical facts, established details, and continuity anchors
    location: campaign
    persistent: true
    reads: [dramaturg, narrator, oracle, scribe, system, fates, entropy-architect/architect]
    writes: [scribe]

  - id: history.md
    description: Narrative history log of completed turns
    location: campaign
    persistent: true
    reads: []
    writes: [scribe]

  - id: thread.md
    description: Active narrative threads and unresolved hooks
    location: campaign
    persistent: true
    reads: []
    writes: [scribe]

  - id: character-memory.yaml
    description: Per-character memory and relationship state
    location: campaign
    persistent: true
    reads: [narrator, cast, dramaturg, scene-sim/simulator, dialogue]
    writes: [scribe]

  - id: quality-log.yaml
    description: Per-turn quality metrics for trend analysis
    location: campaign
    persistent: true
    reads: [dramaturg]
    writes: [scribe]

  # --- Templates (read-only reference) ---
  - id: arc.template.yaml
    description: Arc structure template for new campaign creation
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: entities.template.yaml
    description: Entity index template for new game creation
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: author.template.yaml
    description: Author voice profile template
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: setting.template.yaml
    description: World setting template
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: session.template.yaml
    description: Session state template for coordinator init
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: continuity.template.yaml
    description: Continuity tracking template
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: entities/characters/protagonist.template.yaml
    description: Protagonist character sheet template
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

# ==========================================
# WORKSPACE
# ==========================================

workspace:
  path: ".ai/games/"
  create_on_init: false
  variables:
    source: ".ai/tx/narrative-engine/session.yaml"
    mapping:
      game-id: game_id
      campaign-id: campaign_id
      N: turn
  locations:
    session: ".ai/tx/narrative-engine/"
    workspace: "{game}/campaigns/{campaign-id}/turns/turn-{N}/"
    game: ".ai/games/{game-id}/"
    campaign: "{game}/campaigns/{campaign-id}/"
    entities: "{game}/entities/"
    template: "meshes/narrative-engine/templates/"

# Turn workspace template (resolved after game exists)
turn_workspace:
  path: ".ai/games/{game-id}/campaigns/{campaign-id}/turns/"
  create_on_init: false
  cleanup_on_complete: false
