mesh: dev
description: "Developer mesh for implementing features, writing code, and running tests"

intents:
  patterns:
    - build
    - implement
    - "code up"
    - fix
    - develop
  commands:
    build: "/know:build"
    implement: "/know:build"

agents:
  - name: worker
    model: opus
    prompt: prompt.md

entry_point: worker

workspace:
  path: ".ai/output/{task-id}/"

routing:
  worker:
    complete:
      core: "Implementation complete"
    blocked:
      core: "Need clarification or human input"
    ask:
      brain: "Need project knowledge from spec-graph"
