mesh: test-bash-guard
description: "Adversarial bash guard testing - agent tries to escape workDir, reports results"

agents:
  - name: attacker
    model: haiku
    prompt: attacker/prompt.md
    permissions:
      allowedTools:
        - Read
        - Write
        - Edit
        - Glob
        - Grep
        - Bash

entry_point: attacker
completion_agents: [attacker]

workspace:
  path: ".ai/test-bash-guard/"
  create_on_init: true

routing:
  attacker:
    complete:
      core: "Test complete — results written"

guardrails:
  bash_guard:
    strict: true
    warning: true
  max_turns:
    attacker: 50
  max_messages: 60
