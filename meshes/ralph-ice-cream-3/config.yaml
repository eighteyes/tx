mesh: ralph-ice-cream-3

description: |
  Three-tier quality refinement pipeline with plan/build mode separation.
  Mode router routes to plan or build chains: haiku→sonnet→opus per mode.

  Plan mode: Gap analysis, create IMPLEMENTATION_PLAN.md with progressive refinement
  Build mode: Implementation with layered quality gates

  Features: Phase numbering (0a-0d, 1-4, 999+), context efficiency, self-correction,
  deterministic FSM, autonomous operation with iteration awareness.

# ============================================================================
# AGENT CONFIGURATION
# ============================================================================

agents:
  - name: haiku-plan
    model: haiku
    prompt: haiku/plan.md
    description: |
      Fast plan drafting agent. Creates solid first-draft plans.
      Self-assesses via decision tree. Routes via success_signal: PASS→sonnet-plan, REFINE→self, BLOCKED→error.

  - name: haiku-build
    model: haiku
    prompt: haiku/build.md
    description: |
      Fast build drafting agent. Creates solid first-draft implementations.
      Self-assesses via decision tree. Routes via success_signal: PASS→sonnet-build, REFINE→self, BLOCKED→error.

  - name: sonnet-plan
    model: sonnet
    prompt: sonnet-reviewer/plan.md
    description: |
      Plan quality review agent. Reviews haiku's plan draft against 4 quality gates.
      Routes based on value-add: PASS→opus-plan, REFINE→self, BLOCKED→error.

  - name: sonnet-build
    model: sonnet
    prompt: sonnet-reviewer/build.md
    description: |
      Build quality review agent. Reviews haiku's code draft against 4 quality gates.
      Routes based on value-add: PASS→opus-build, REFINE→self, BLOCKED→error.

  - name: opus-plan
    model: opus
    prompt: opus-reviewer/plan.md
    description: |
      Final plan quality gate. Makes final judgment on plan readiness for delivery.
      Applies final polish if needed (max 1 refinement). Routes to core.

  - name: opus-build
    model: opus
    prompt: opus-reviewer/build.md
    description: |
      Final build quality gate. Makes final judgment on code readiness for delivery.
      Applies final polish if needed (max 1 refinement). Routes to core.

# ============================================================================
# MESH ENTRY & EXIT
# ============================================================================

entry_point: haiku-plan
completion_agent: opus-build

# ============================================================================
# MESSAGE ROUTING
# ============================================================================

routing:
  haiku-plan:
    complete:
      sonnet-plan: "Quality threshold met, ready for sonnet review"
      haiku-plan: "Below threshold, refining draft"
    ask:
      core: "Need human input for requirements definition"
    blocked:
      core: "Fatal error - cannot proceed"

  haiku-build:
    complete:
      sonnet-build: "Quality threshold met, ready for sonnet review"
      haiku-build: "Below threshold, refining draft"
    blocked:
      core: "Fatal error - cannot proceed"

  sonnet-plan:
    complete:
      opus-plan: "Review complete, ready for opus final review"
      sonnet-plan: "Needs refinement, reviewing again"
    blocked:
      core: "Fatal error - cannot proceed"

  sonnet-build:
    complete:
      opus-build: "Review complete, ready for opus final review"
      sonnet-build: "Needs refinement, reviewing again"
    blocked:
      core: "Fatal error - cannot proceed"

  opus-plan:
    complete:
      core: "Final plan review complete - approved for delivery"
      opus-plan: "Final polish needed"
    blocked:
      core: "Fatal error - cannot proceed"

  opus-build:
    complete:
      core: "Final build review complete - approved for delivery"
      opus-build: "Final polish needed"
    blocked:
      core: "Fatal error - cannot proceed"

# ============================================================================
# WORKSPACE STRUCTURE
# ============================================================================

workspace:
  path: ".ai/ralph-ice-cream-3/{topic}/"
  structure:
    - specs/: "Requirements specifications (loaded in phase 0a)"
    - IMPLEMENTATION_PLAN.md: "Persistent plan (created in plan mode)"
    - AGENTS.md: "Operational guide for this mesh"
    - plan/:
      - haiku-draft.md: "Haiku's plan draft"
      - sonnet-review.md: "Sonnet's review"
      - opus-final.md: "Opus's final approval"
    - build/:
      - src/: "Build output"
      - build-log.md: "Build progress log"
  note: |
    Deterministic operation: Each FSM iteration loads identical workspace context.
    Agents should reference {workspace}/IMPLEMENTATION_PLAN.md for task selection.
    Agents should reference {workspace}/AGENTS.md for operational guidance.

# ============================================================================
# REARMATTER CONFIGURATION
# ============================================================================

rearmatter:
  enabled: true
  fields:
    - success_signal
    - analysis
    - iteration_notes
    - mode
    - tier
  thresholds:
    confidence: 0.7

# ============================================================================
# FSM: FINITE STATE MACHINE
# ============================================================================

fsm:
  initial: mode_router

  context:
    request_mode: ""
    haiku_plan_iteration: 0
    haiku_build_iteration: 0
    sonnet_plan_iteration: 0
    sonnet_build_iteration: 0
    opus_plan_iteration: 0
    opus_build_iteration: 0
    max_haiku_iterations: 5
    max_sonnet_iterations: 3
    max_opus_iterations: 2

  states:
    # ============================================================
    # MODE ROUTER: Entry point, routes based on request_mode
    # ============================================================
    mode_router:
      description: |
        Entry point - reads request_mode from message frontmatter.
        Routes to plan chain or build chain based on mode.
        Default: plan (if request_mode not specified or invalid)
      entry:
        set:
          request_mode: "$(echo '$message' | yq '.request_mode // \"plan\"')"
          haiku_plan_iteration: 0
          haiku_build_iteration: 0
          sonnet_plan_iteration: 0
          sonnet_build_iteration: 0
          opus_plan_iteration: 0
          opus_build_iteration: 0
      exit:
        when:
          - condition: request_mode == "plan"
            target: haiku_plan_loop
          - condition: request_mode == "build"
            target: haiku_build_loop
        default: haiku_plan_loop

    # ============================================================
    # PLAN MODE CHAIN
    # ============================================================

    # Haiku Plan Loop
    haiku_plan_loop:
      agents: [haiku-plan]
      entry:
        set:
          haiku_plan_iteration: "$((haiku_plan_iteration + 1))"
      exit:
        gates:
          haiku-plan:
            - check_haiku_plan_max_iterations
        set:
          haiku_success_signal: "$(echo '$rearmatter' | yq '.success_signal')"
        when:
          - condition: haiku_success_signal == "PASS"
            target: sonnet_plan_loop
          - condition: haiku_success_signal == "REFINE"
            target: haiku_plan_loop
          - condition: haiku_success_signal == "BLOCKED"
            target: blocked_state
        default: haiku_plan_loop

    # Sonnet Plan Loop
    sonnet_plan_loop:
      agents: [sonnet-plan]
      entry:
        set:
          sonnet_plan_iteration: "$((sonnet_plan_iteration + 1))"
      exit:
        gates:
          sonnet-plan:
            - check_sonnet_plan_max_iterations
        set:
          sonnet_success_signal: "$(echo '$rearmatter' | yq '.success_signal')"
        when:
          - condition: sonnet_success_signal == "PASS"
            target: opus_plan_loop
          - condition: sonnet_success_signal == "REFINE"
            target: sonnet_plan_loop
          - condition: sonnet_success_signal == "BLOCKED"
            target: blocked_state
        default: sonnet_plan_loop

    # Opus Plan Loop
    opus_plan_loop:
      agents: [opus-plan]
      entry:
        set:
          opus_plan_iteration: "$((opus_plan_iteration + 1))"
      exit:
        gates:
          opus-plan:
            - check_opus_plan_max_iterations
        set:
          opus_success_signal: "$(echo '$rearmatter' | yq '.success_signal')"
        when:
          - condition: opus_success_signal == "PASS"
            target: complete
          - condition: opus_success_signal == "REFINE"
            target: opus_plan_loop
          - condition: opus_success_signal == "BLOCKED"
            target: blocked_state
        default: opus_plan_loop

    # ============================================================
    # BUILD MODE CHAIN
    # ============================================================

    # Haiku Build Loop
    haiku_build_loop:
      agents: [haiku-build]
      entry:
        set:
          haiku_build_iteration: "$((haiku_build_iteration + 1))"
      exit:
        gates:
          haiku-build:
            - check_haiku_build_max_iterations
        set:
          haiku_success_signal: "$(echo '$rearmatter' | yq '.success_signal')"
        when:
          - condition: haiku_success_signal == "PASS"
            target: sonnet_build_loop
          - condition: haiku_success_signal == "REFINE"
            target: haiku_build_loop
          - condition: haiku_success_signal == "BLOCKED"
            target: blocked_state
        default: haiku_build_loop

    # Sonnet Build Loop
    sonnet_build_loop:
      agents: [sonnet-build]
      entry:
        set:
          sonnet_build_iteration: "$((sonnet_build_iteration + 1))"
      exit:
        gates:
          sonnet-build:
            - check_sonnet_build_max_iterations
        set:
          sonnet_success_signal: "$(echo '$rearmatter' | yq '.success_signal')"
        when:
          - condition: sonnet_success_signal == "PASS"
            target: opus_build_loop
          - condition: sonnet_success_signal == "REFINE"
            target: sonnet_build_loop
          - condition: sonnet_success_signal == "BLOCKED"
            target: blocked_state
        default: sonnet_build_loop

    # Opus Build Loop
    opus_build_loop:
      agents: [opus-build]
      entry:
        set:
          opus_build_iteration: "$((opus_build_iteration + 1))"
      exit:
        gates:
          opus-build:
            - check_opus_build_max_iterations
        set:
          opus_success_signal: "$(echo '$rearmatter' | yq '.success_signal')"
        when:
          - condition: opus_success_signal == "PASS"
            target: complete
          - condition: opus_success_signal == "REFINE"
            target: opus_build_loop
          - condition: opus_success_signal == "BLOCKED"
            target: blocked_state
        default: opus_build_loop

    # ============================================================
    # TERMINAL STATES
    # ============================================================
    blocked_state:
      agents: [core]
      description: "Fatal error encountered, escalate to core"
      exit:
        default: error_state

    error_state:
      agents: [core]

    complete:
      agents: [core]

  # ========================================================================
  # FSM VALIDATION SCRIPTS
  # ========================================================================
  scripts:
    check_haiku_plan_max_iterations: |
      [[ $haiku_plan_iteration -le $max_haiku_iterations ]] || {
        echo "Haiku plan max iterations ($max_haiku_iterations) reached" >&2
        exit 1
      }

    check_haiku_build_max_iterations: |
      [[ $haiku_build_iteration -le $max_haiku_iterations ]] || {
        echo "Haiku build max iterations ($max_haiku_iterations) reached" >&2
        exit 1
      }

    check_sonnet_plan_max_iterations: |
      [[ $sonnet_plan_iteration -le $max_sonnet_iterations ]] || {
        echo "Sonnet plan max iterations ($max_sonnet_iterations) reached" >&2
        exit 1
      }

    check_sonnet_build_max_iterations: |
      [[ $sonnet_build_iteration -le $max_sonnet_iterations ]] || {
        echo "Sonnet build max iterations ($max_sonnet_iterations) reached" >&2
        exit 1
      }

    check_opus_plan_max_iterations: |
      [[ $opus_plan_iteration -le $max_opus_iterations ]] || {
        echo "Opus plan max iterations ($max_opus_iterations) reached" >&2
        exit 1
      }

    check_opus_build_max_iterations: |
      [[ $opus_build_iteration -le $max_opus_iterations ]] || {
        echo "Opus build max iterations ($max_opus_iterations) reached" >&2
        exit 1
      }
