# World Rule Entity Template - Magic System
# Copy to: .ai/games/{game-id}/entities/world-rules/magic-system.yaml
# For magic/supernatural systems in the world

id: magic-system
type: world-rule
name: "Magic System Name"

# ============================================
# TRAITS - How magic WORKS in this world
# ============================================
traits:
  # Domain - what aspect of reality this governs
  domain: magic                 # magic | supernatural | psychic | divine

  # Source - where power comes from
  source: ""
    # Examples:
    # "Drawn from the ley lines beneath the earth"
    # "Powered by emotional intensity"
    # "Granted by pact with otherworldly entities"

  # Cost - what magic requires
  costs:
    primary: ""                 # "Sanity", "Years of life", "Blood", "Memory"
    scaling: ""                 # "Linear with effect power", "Exponential for large effects"
    examples:
      - effect: "Light a candle"
        cost: "Mild headache"
      - effect: "Summon storm"
        cost: "Unconsciousness for days, permanent tremor"

  # Constraints - hard rules that cannot be broken
  constraints: []
    # Examples:
    # - "Cannot resurrect the truly dead"
    # - "Requires verbal component - mutes cannot cast"
    # - "Iron disrupts all magical effects"
    # - "Magic cannot affect unwilling targets without physical contact"

  # Exceptions - things that bypass normal rules
  exceptions: []
    # Examples:
    # - "Ancient artifacts bypass verbal requirement"
    # - "Blood magic ignores the iron disruption"
    # - "Those born during eclipses are immune to mind magic"

  # Tells - how magic manifests visibly
  tells:
    casting: []                 # ["Eyes glow", "Temperature drops", "Shadows lengthen"]
    active_effect: []           # ["Faint hum", "Shimmer in air", "Smell of ozone"]
    aftermath: []               # ["Nosebleed", "Fatigue", "Temporary blindness"]

# ============================================
# EPISODES - How magic has been used in story
# ============================================
episodes: []
  # - turn: 7
  #   event: "Protagonist learned verbal constraint the hard way"
  #   state_change:
  #     constraint_revealed: "verbal_requirement"
  # - turn: 15
  #   event: "Ancient artifact bypassed normal rules"
  #   state_change:
  #     exception_discovered: "artifact_bypass"

# ============================================
# CURRENT_STATE - Magic system's story status
# ============================================
current_state:
  constraints_known_to_protagonist: []  # Which rules protagonist has learned
  exceptions_known_to_protagonist: []   # Which exceptions protagonist has discovered
  total_cost_accumulated: null          # Tracking if costs build up over story

# Known practitioners - who can use magic
known_practitioners:
  protagonist_capable: false
  npc_practitioners: []         # [character-ids who can use magic]

# Ambient magic - environmental effects
ambient_effects:
  locations_with_magic: []      # [location-ids with magical properties]
  current_magical_weather: null # "Ley lines dormant", "Wild magic surge"
