    event: "Practical alarm bells ringing. Asked directly: 'Are we being made the same offer? Is communion—IS THIS the question?' Looked at her own hand holding Sarah. Awareness of touch as potential BINDING. Then firmed grip anyway—won't let go, but AWARE now."
    state_change:
      clarity_needed: "need to know terms BEFORE signing"
      choice_confirmed: "aware of what holding means, choosing to anyway"

  - turn: 28
    event: "Attempted partial rest but eyes remained OPEN. Scanning platform for contract terms written in architecture. Mind running scenarios: if yes, what happens? If no, can they leave? Is Door 8 exit or deeper commitment?"
    state_change:
      rest_status: "impossible"
      vigilance: "practical mind won't quiet without parameters"

