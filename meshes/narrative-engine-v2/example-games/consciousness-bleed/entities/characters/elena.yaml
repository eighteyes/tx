  - turn: 28
    event: "During station's catastrophic memory flood, felt Sarah's overload THROUGH hand-hold communion. Not vision but IMPACT. Grabbed Sarah's hand with BOTH hands, white-knuckled anchoring. 'Come back. Follow my hand.'"
