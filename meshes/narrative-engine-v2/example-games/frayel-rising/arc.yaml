momentum: stable  # Early arrival phase. Establishing baseline.

seeds:
  planted:
    - name: "Vendor's unexpected kindness"
      turn_planted: 1
      status: "active_seed"
      pressure_delta: "-2 (fractured armor, revealed vulnerability)"
    - name: "Deploy Test's critical damage"
      turn_planted: 1
      status: "active_seed"
      pressure_delta: "+3 (urgency mounting)"
    - name: "Credit shortage becoming critical"
      turn_planted: 1
      status: "active_seed"
      pressure_delta: "+2 (math doesn't work)"

  ready: []

  bloomed: []

questions:
  - text: "Can she find a foothold in this station?"
    pressure: 40
    pressure_delta: +15  # Activation turn. PROVE_HERSELF trait triggered.
    status: "pressurized"
    manifestation: "Job board awaits with likely rejection"

  - text: "Will anyone show her kindness, or just fear?"
    pressure: 15
    pressure_delta: +10  # Vendor encounter suggests possibility.
    status: "emerging"
    manifestation: "One baseline human charged fair price. Pattern break."

trait_pressure_end_turn_1:
  PROVE_HERSELF: 15/20
  INDEPENDENCE: 15/20
  SHARP_WIT: 12/20
  SHIP_BOND: 10/20

