# narrative-engine-v2/config.yaml
# Collapsed single-mesh RPG — entropy-architect + scene-sim folded in
# All agents in one routing table. No cross-mesh hops.

mesh: narrative-engine-v2
description: "Collapsed single-mesh RPG. Entropy architect, scene simulator, and narrative pipeline in one mesh. Traits are semantically weighted, damage is trait accumulation, outcomes emerge from JIT probability tables + external entropy."

agents:
  # ==========================================
  # PHASE COORDINATORS (sonnet - precise routing)
  # ==========================================

  - name: entry
    model: sonnet
    prompt: coordinator/entry.md

  - name: game-coord
    model: sonnet
    prompt: coordinator/game-coord.md

  # RETIRED: prologue-coord — calibrator routes directly to narrator for prologue rendering
  # - name: prologue-coord
  #   model: sonnet
  #   prompt: coordinator/prologue-coord.md

  - name: init-turn
    model: sonnet
    prompt: coordinator/init-turn.md
    continuation: false
    # Renamed from init-coord — creates workspace, validates action coherence

  # RETIRED: prep-coord replaced by direct agent chain routing + state-discovery.sh
  # - name: prep-coord
  #   model: sonnet
  #   prompt: coordinator/prep-coord.md

  # RETIRED: render-coord — editor routes directly to scribe + visual
  # - name: render-coord
  #   model: sonnet
  #   prompt: coordinator/render-coord.md

  # RETIRED: validate-coord — oracle branches directly (approved → narrator, violations → scene-crafter)
  # - name: validate-coord
  #   model: sonnet
  #   prompt: coordinator/validate-coord.md

  # RETIRED: compress-coord — scribe is now completion_agent, routes to core directly
  # - name: compress-coord
  #   model: sonnet
  #   prompt: coordinator/compress-coord.md

  # ==========================================
  # ENTROPY + SIMULATION (collapsed from entropy-architect + scene-sim)
  # ==========================================

  - name: architect
    model: sonnet
    prompt: architect/prompt.md
    read_gate: strict
    # Collapsed entropy pipeline — fates + dramaturg + possibility + system in one session
    # Parallel blind Tasks for world possibilities, inline story shaping and resolution

  - name: simulator
    model: sonnet
    prompt: simulator/prompt.md
    # Beat-by-beat scene simulation — orchestrates blind table-gen and NPC voice Tasks
    # All table/voice generation is inline via Task tool, not mesh routing

  # ==========================================
  # CREATIVE AGENTS (sonnet/opus)
  # ==========================================

  - name: narrator
    model: opus
    prompt: narrator/prompt.md
    continuation: true
    # phase 2,3 - Prose rendering with staged build (1.5-2k words)
    # Orchestrates system, cast, lint/edit cycle

  - name: calibrator
    model: opus
    prompt: calibrator/prompt.md
    # Game creation - HITL worldbuilding extraction
    # 9-phase extraction loop via HITL messages to core
    # Creates author.yaml, setting.yaml, arc.yaml, entities
    # Hands off to narrator for prologue when complete

  - name: editor
    model: opus
    prompt: editor/prompt.md
    continuation: true
    # Adversarial prose review against author.yaml

  - name: visual
    model: sonnet
    prompt: visual/prompt.md
    # Multi-beat emotional visualization
    # Reads prose.md, generates style variants per beat

  - name: oracle
    model: sonnet
    prompt: oracle/prompt.md
    # Continuity validation + knowledge queries for entity data

  - name: scribe
    model: sonnet
    prompt: scribe/prompt.md
    # Context compression, state management, game canon promotion
    # Only fires if oracle passes (or max iterations)

  # ==========================================
  # LINT PIPELINE (refactored)
  # ==========================================
  # Mechanical lints run as script in narrator Phase 5 (mechanical-lint.sh)
  # Creative linters: lint-patterns -> lint-temporal -> lint-metaphor
  # lint-metaphor gates editor (creative violations -> editor, clean -> scribe)
  #
  # RETIRED agents (now in mechanical-lint.sh):
  # - lint-forbidden-words, lint-ai-tells, lint-cadence, lint-dialogue
  # - lint-body-first, lint-litotes
  # RETIRED agents (oracle already covers):
  # - lint-factoids, lint-props

  - name: lint-patterns
    model: sonnet
    prompt: linters/patterns.md
    # Creative: Pattern detection requiring judgment
    # "She realized", "Fear washed over", etc.

  - name: lint-temporal
    model: sonnet
    prompt: linters/temporal.md
    # Creative: Temporal consistency against timeline.md
    # Checks prose time references match canonical chronology

  - name: lint-metaphor
    model: sonnet
    prompt: linters/metaphor.md
    # Creative: Repeated sensory channels
    # One peak expression per channel per scene
    # FINAL LINTER: routes to editor (violations) or scribe (clean)

entry_point: entry

# Two completion agents for different workflows (first-wins):
# - game-coord: New Game workflow ends after calibration
# - scribe: Write Turn workflow ends after scribe sends completion
completion_agents:
  - game-coord
  - scribe

# Session persistence: keep sessions across mesh runs (default: false)
# persistence: true

# ==========================================
# ROUTING - Phase coordinator architecture
# ==========================================

routing_fallback: entry
routing_retry_max: 3

routing:
  # All agent communication uses 'message' type.
  # Messages to core/core are implicitly HITL (session pauses).
  # The system infers routing from destination.
  #
  # Phase flow: entry → game-coord|init-turn → architect → simulator → oracle ⇄ simulator → narrator → [mechanical-lint.sh] → lint-patterns → lint-temporal → lint-metaphor → editor|scribe → visual (opt-in) → scribe → core
  # (Old chain v1: init-turn → fates → dramaturg → possibility → system → cast → scene-crafter → oracle → dialogue → narrator)
  # (Old chain v2: entropy-architect → cast → scene-crafter → oracle → dialogue → narrator)
  # Prep chain: direct agent-to-agent routing, no coordinator. Recovery via state-discovery.sh --next

  # Phase coordinators
  entry:
    message:
      game-coord: "Route new game or edit game request"
      init-turn: "Route player action"
      narrator: "Recovery: resume prologue (check prologue.md absence) | resume render phase"
      oracle: "Recovery: resume validation"
      scribe: "Recovery: resume compression"
      core: "Turn in progress OR message-state confusion"

  game-coord:
    message:
      calibrator: "HITL game creation"
      core: "New game calibration complete"

  # RETIRED: prologue-coord — calibrator routes directly to narrator
  # prologue-coord:
  #   message:
  #     dramaturg: "Prologue workspace ready"

  init-turn:
    message:
      architect: "Turn workspace ready — action locked"

  # ==========================================
  # ENTROPY + SIMULATION ROUTING (collapsed)
  # ==========================================

  architect:
    message:
      simulator: "Mechanical resolution complete → simulate scene beats"
      core: "HITL — action-lock conflict after 3 entropy attempts"

  simulator:
    message:
      oracle: "Scene simulation complete → validate continuity"
      core: "HITL — player choice point during simulation"

  # RETIRED: validate-coord — oracle routes directly (approved → narrator, violations → scene-crafter)
  # validate-coord:
  #   message:
  #     oracle: "Validate continuity"
  #     scene-crafter: "Fix outline violations"
  #     narrator: "Scene approved → render prose"

  # ==========================================
  # CREATIVE AGENT ROUTING
  # ==========================================

  calibrator:
    message:
      core: "HITL extraction / worldbuilder tuning | Session complete"
      narrator: "Game creation complete — render prologue"

  narrator:
    message:
      oracle: "Knowledge query"
      lint-patterns: "Lint prose — mechanical lints complete, start creative chain"
      scribe: "Prologue complete — finalize and deliver"

  oracle:
    message:
      narrator: "Continuity approved → render prose"
      simulator: "Continuity violations → fix scene script"

  scribe:
    message:
      core: "Turn complete — prose + rearmatter delivered"

  # ==========================================
  # LINT PIPELINE ROUTING (refactored)
  # ==========================================
  # Mechanical lints run as script in narrator Phase 5
  # Creative linters: lint-patterns → lint-temporal → lint-metaphor
  # lint-metaphor gates editor (creative violations → editor, clean → scribe)

  lint-patterns:
    message:
      lint-temporal: "Next lint — temporal consistency check"

  lint-temporal:
    message:
      lint-metaphor: "Next lint — creative metaphor analysis"

  lint-metaphor:
    message:
      editor: "Creative violations found → fix and polish"
      scribe: "Clean prose → skip editor, promote directly"

  # ==========================================
  # EDITOR
  # ==========================================

  editor:
    message:
      scribe: "Prose finalized → compress and complete"
      visual: "Prose finalized → generate visuals (opt-in)"

  visual:
    message:
      scribe: "Visual beats complete → compress and complete"

# ==========================================
# MANIFEST ENFORCEMENT
# ==========================================

manifest_enforcement:
  post_validation: true
  pre_validation: true
  max_retry: 2

# ==========================================
# GUARDRAILS
# ==========================================

guardrails:
  max_messages:
    limit: 3
  routing_error:
    strict: true
    warning: true
    max_retries: 2
  write_gate:
    strict: false
    warning: true
    kill_threshold: 50
  agents:
    init-turn:
      routing_error:
        strict: true
    editor:
      max_messages:
        limit: 5

# ==========================================
# MANIFEST - File-centric I/O manifest (source of truth)
# ==========================================

manifest:
  # --- Session State ---
  - id: session.yaml
    description: Coordinator handoff state persisted across turns
    location: session
    persistent: true
    reads: [entry, game-coord, init-turn, scribe, calibrator]
    # Writers limited to 2: init-turn (full rewrite at turn start) and scribe (mark complete at turn end)
    # entry reads only for routing. game-coord and calibrator write only during game creation (via calibrator).
    writes: [init-turn, scribe, calibrator]

  # --- Turn Workspace (per-turn artifacts) ---
  - id: context.yaml
    description: Turn context seeded by coordinator, consumed by creative agents
    location: workspace
    reads: [narrator, scribe, architect, simulator]
    writes: [init-turn]

  - id: intent.yaml
    description: Single source for player action — raw input, clarified intent, hopes, off-table outcomes
    location: workspace
    reads: [narrator, architect, simulator]
    writes: [init-turn]

  - id: action-lock.yaml
    description: Locked player action — ground truth, not subject to entropy
    location: workspace
    reads: [narrator, architect, simulator]
    writes: [init-turn]

  - id: dramaturg-notes.yaml
    description: Story analysis and outcome shapes (no weights)
    location: workspace
    reads: [narrator, scribe, simulator]
    writes: [architect]

  - id: fates.yaml
    description: World possibility branching tree (no weights)
    location: workspace
    reads: [narrator, scribe, visual]
    writes: [architect]

  - id: entropy-tables.yaml
    description: Weighted probability tables synthesized from fates + dramaturg
    location: workspace
    reads: [architect, simulator]
    writes: [architect]

  - id: entropy-selection.yaml
    description: Resolved entropy outcomes from primary + subtable rolls
    location: workspace
    reads: [narrator, scribe]
    writes: [architect]

  - id: resolution.yaml
    description: Mechanical outcome tables and trait resolution
    location: workspace
    reads: [narrator, scribe, simulator]
    writes: [architect]

  - id: threads.yaml
    description: Life thread extraction, collisions, and beat guidance — written by architect, consumed by simulator/narrator/scribe
    location: workspace
    reads: [simulator, narrator, scribe]
    writes: [architect]

  - id: sim-progress.yaml
    description: Simulator checkpoint — phase, beat count, thread tracking, scene state
    location: workspace
    reads: [simulator]
    writes: [simulator]

  - id: pov-resolution.yaml
    description: POV character resolution from Step 3a — intermediate entropy result
    location: workspace
    reads: [architect]
    writes: [architect]

  - id: entropy_tables/
    description: "Per-domain entropy table fragments — written by parallel Tasks, merged by merge-entropy-tables.sh. Includes: char-*.yaml (outcome tables), char-*-directions.yaml (direction tables), world-*.yaml, texture.yaml, threads-*.yaml, collisions.yaml"
    location: workspace
    reads: [architect]
    writes: [architect]

  - id: beat_tables/
    description: Per-beat YAML files — complete possibility space with tables, rolls, and voice data. Audit trail.
    location: workspace
    reads: []
    writes: [simulator]

  - id: scene_script.yaml
    description: Beat-by-beat scene script with voices, time progression, prop tracking, pacing. Produced by simulator.
    location: workspace
    reads: [narrator, oracle, visual, scribe, lint-temporal]
    writes: [simulator]

  - id: prose-draft.md
    description: Working prose draft iterated through lint/edit cycle
    location: workspace
    reads: [narrator, editor, lint-patterns, lint-temporal, lint-metaphor]
    writes: [narrator, editor]

  - id: prose.md
    description: Final approved prose output for the turn
    location: workspace
    reads: [scribe, visual, narrator, editor]
    writes: [editor, lint-metaphor]

  - id: visual.yaml
    description: Multi-beat emotional visualization briefs with style variants
    location: workspace
    reads: [scribe]
    writes: [visual]

  - id: concordance.txt
    description: Per-turn word frequency extract for overuse detection
    location: workspace
    reads: [narrator]
    writes: [narrator]

  - id: dialogue-pairs.txt
    description: Extracted dialogue tag/line pairs for lint analysis
    location: workspace
    reads: [narrator]
    writes: [narrator]

  - id: violations.yaml
    description: Aggregated lint violations for editor review
    location: workspace
    reads: [editor, lint-patterns, lint-temporal, lint-metaphor]
    writes: [narrator, lint-patterns, lint-temporal, lint-metaphor]

  - id: story-concordance.txt
    description: Cumulative word frequency data for cross-turn overuse detection
    location: game
    persistent: true
    reads: [narrator]
    writes: [scribe]

  - id: summary.md
    description: Compressed turn summary for context window management
    location: workspace
    reads: []
    writes: [scribe]

  # RETIRED: closing.yaml — replaced by scene.yaml (campaign-level, single source of truth)
  # - id: closing.yaml
  #   description: Canonical physical state at turn end for next turn continuity
  #   location: workspace
  #   reads: [init-turn, narrator]
  #   writes: [scribe]

  - id: calibration-state.yaml
    description: HITL calibration extraction progress tracker
    location: workspace
    reads: [calibrator]
    writes: [calibrator]

  # --- Game Root ---
  - id: author.yaml
    description: Author voice profile and stylistic constraints
    location: game
    persistent: true
    reads: [narrator, editor, visual, calibrator, architect, simulator]
    writes: [calibrator]

  - id: setting.yaml
    description: World setting, geography, tone, and genre parameters
    location: game
    persistent: true
    reads: [narrator, oracle, calibrator, architect]
    writes: [calibrator]

  - id: entities.yaml
    description: Master entity index with traits, relationships, status
    location: game
    persistent: true
    reads: [narrator, oracle, scribe, calibrator]
    writes: [scribe, calibrator]

  - id: entities/characters/
    description: Individual character entity files (traits, bonds, state)
    location: game
    persistent: true
    reads: [init-turn, narrator, oracle, scribe, calibrator, visual, architect, simulator]
    writes: [scribe, calibrator]

  - id: entities/bonds/
    description: Bond entity files (relationship intensity, dynamics)
    location: game
    persistent: true
    reads: [scribe, architect, simulator]
    writes: [scribe, calibrator]

  - id: story-corpus.txt
    description: Append-only full prose archive across all turns
    location: game
    persistent: true
    reads: []
    writes: [scribe]


  # --- Campaign State ---
  - id: arc.yaml
    description: Story arc structure, act progression, and tension curves
    location: campaign
    persistent: true
    reads: [narrator, scribe, calibrator, architect]
    writes: [scribe, calibrator]

  - id: turns/
    description: Turn workspace directories (init-turn creates new turn dirs)
    location: campaign
    reads: [init-turn, entry]
    writes: [init-turn, entry]

  - id: turns/turn-*/prose.md
    description: Prior turn finalized prose for cross-turn style consistency
    location: campaign
    reads: [editor]
    writes: [scribe]

  # RETIRED: state.yaml — replaced by scene.yaml (campaign-level, single source of truth)
  # - id: state.yaml
  #   description: Campaign mechanical state — active effects, conditions, resources
  #   location: campaign
  #   persistent: true
  #   reads: [init-turn, dramaturg, system, scribe, fates]
  #   writes: [init-turn, scribe]

  - id: scene.yaml
    description: Canonical scene state — location, closing positions, arc pressure, time. Replaces closing.yaml + state.yaml.
    location: campaign
    persistent: true
    reads: [init-turn, architect, simulator, lint-temporal]
    writes: [scribe]

  - id: trajectories.yaml
    description: Committed futures with timers (Chekhov's Guns)
    location: campaign
    persistent: true
    reads: [architect]
    writes: [scribe]

  - id: timeline.md
    description: Canonical time tracking in markdown — day headers, turn entries, beat-level time stretches
    location: campaign
    persistent: true
    reads: [narrator, architect, lint-temporal]
    writes: [scribe]

  - id: continuity.yaml
    description: Canonical facts, established details, and continuity anchors
    location: campaign
    persistent: true
    reads: [narrator, oracle, scribe, architect]
    writes: [scribe]

  - id: history.md
    description: Narrative history log of completed turns
    location: campaign
    persistent: true
    reads: []
    writes: [scribe]

  - id: thread.md
    description: Active narrative threads and unresolved hooks
    location: campaign
    persistent: true
    reads: []
    writes: [scribe]

  - id: character-memory.yaml
    description: Per-character memory and relationship state
    location: campaign
    persistent: true
    reads: []
    writes: [scribe]

  # --- Templates (read-only reference) ---
  - id: arc.template.yaml
    description: Arc structure template for new campaign creation
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: entities.template.yaml
    description: Entity index template for new game creation
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: author.template.yaml
    description: Author voice profile template
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: setting.template.yaml
    description: World setting template
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: session.template.yaml
    description: Session state template for coordinator init
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: continuity.template.yaml
    description: Continuity tracking template
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: entities/characters/protagonist.template.yaml
    description: Protagonist character sheet template
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

# ==========================================
# WORKSPACE
# ==========================================

workspace:
  path: ".ai/games/"
  create_on_init: false
  variables:
    source: ".ai/tx/narrative-engine-v2/session.yaml"
    mapping:
      game-id: game_id
      campaign-id: campaign_id
      N: turn
  locations:
    session: ".ai/tx/narrative-engine-v2"
    game: ".ai/games/{game-id}"
    campaign: ".ai/games/{game-id}/campaigns/{campaign-id}"
    workspace: ".ai/games/{game-id}/campaigns/{campaign-id}/turns/turn-{N}"
