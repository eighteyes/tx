# narrative-engine-v2/config.yaml
# Collapsed single-mesh RPG — entropy-architect + scene-sim folded in
# All agents in one routing table. No cross-mesh hops.

mesh: narrative-engine-v2
description: "Collapsed single-mesh RPG. Entropy architect, scene simulator, and narrative pipeline in one mesh. Traits are semantically weighted, damage is trait accumulation, outcomes emerge from JIT probability tables + external entropy."

agents:
  # ==========================================
  # PHASE COORDINATORS (sonnet - precise routing)
  # ==========================================

  - name: entry
    model: sonnet
    prompt: coordinator/entry.md

  - name: game-coord
    model: sonnet
    prompt: coordinator/game-coord.md

  # RETIRED: prologue-coord — calibrator routes directly to narrator for prologue rendering
  # - name: prologue-coord
  #   model: sonnet
  #   prompt: coordinator/prologue-coord.md

  - name: init-turn
    model: sonnet
    prompt: coordinator/init-turn.md
    continuation: false
    # Mechanical coordinator — stamps files via scripts, confirms intent, routes to architect
    # Sonnet: reliable prompt-following, won't hallucinate destinations or skip HITL
    permissions:
      allowedTools: [Read, Write, Bash, Glob, Grep]
      disallowedTools: [Task, Edit, NotebookEdit]

  - name: gravity
    model: sonnet
    prompt: gravity/prompt.md
    continuation: false
    # Collision detector — reads all state, finds pressure points, writes collisions.yaml
    # Sits between init-turn and architect. Analytical, not creative.
    postconditions:
      tool_calls:
        - tool: TaskOutput
          min_calls: 3

  # RETIRED: prep-coord replaced by direct agent chain routing + state-discovery.sh
  # - name: prep-coord
  #   model: sonnet
  #   prompt: coordinator/prep-coord.md

  # RETIRED: render-coord — editor routes directly to scribe + visual
  # - name: render-coord
  #   model: sonnet
  #   prompt: coordinator/render-coord.md

  # RETIRED: validate-coord — oracle branches directly (approved → narrator, violations → scene-crafter)
  # - name: validate-coord
  #   model: sonnet
  #   prompt: coordinator/validate-coord.md

  # RETIRED: compress-coord — scribe is now completion_agent, routes to core directly
  # - name: compress-coord
  #   model: sonnet
  #   prompt: coordinator/compress-coord.md

  # ==========================================
  # ENTROPY + SIMULATION (collapsed from entropy-architect + scene-sim)
  # ==========================================

  - name: architect
    model: sonnet
    prompt: architect/prompt.md
    read_gate: strict
    # Collapsed entropy pipeline — fates + dramaturg + possibility + system in one session
    # Parallel blind Tasks for world possibilities, inline story shaping and resolution
    permissions:
      allowedTools: [Read, Write, Edit, Bash, Glob, Grep, Task, TaskOutput]

  - name: sim-planner
    model: sonnet
    prompt: simulator/planner.md
    continuation: false
    # Phase 1: Read all inputs, derive psychology, plan beats, extract author params via yq
    permissions:
      allowedTools: [Read, Write, Bash, Glob, Grep]

  - name: sim-tables
    model: sonnet
    prompt: simulator/tables.md
    # Phase 2: Per-beat table gen (haiku Tasks) + entropy rolling
    permissions:
      allowedTools: [Read, Write, Edit, Bash, Glob, Grep, Task, TaskOutput]

  - name: sim-voices
    model: sonnet
    prompt: simulator/voices.md
    # Phase 3: Per-beat voice gen (sonnet Tasks) + scene_so_far + scene_script.yaml assembly
    permissions:
      allowedTools: [Read, Write, Edit, Bash, Glob, Grep, Task, TaskOutput]

  # ==========================================
  # CREATIVE AGENTS (sonnet/opus)
  # ==========================================

  - name: narrator
    model: opus
    prompt: narrator/prompt.md
    continuation: true
    # phase 2,3 - Per-beat parallel prose rendering via Tasks, then assembly
    # Fires opus Tasks per beat, validates voice/tone, hands off to lint pipeline
    permissions:
      allowedTools: [Read, Write, Edit, Bash, Glob, Grep, Task, TaskOutput]

  - name: calibrator
    model: opus
    prompt: calibrator/prompt.md
    # Game creation - HITL worldbuilding extraction
    # 9-phase extraction loop via HITL messages to core
    # Creates author.yaml, setting.yaml, arc.yaml, entities
    # Hands off to narrator for prologue when complete

  - name: editor
    model: opus
    prompt: editor/prompt.md
    continuation: true
    # Lint pipeline (mechanical + 3 parallel creative Tasks) + adversarial prose review against author.yaml
    permissions:
      allowedTools: [Read, Write, Edit, Bash, Glob, Grep, Task, TaskOutput]

  - name: visual
    model: sonnet
    prompt: visual/prompt.md
    # Multi-beat emotional visualization
    # Reads prose.md, generates style variants per beat

  - name: oracle
    model: sonnet
    prompt: oracle/prompt.md
    # Continuity validation + knowledge queries for entity data

  - name: scribe
    model: sonnet
    prompt: scribe/prompt.md
    # Context compression, state management, game canon promotion
    # Only fires if oracle passes (or max iterations)

  # ==========================================
  # LINT PIPELINE (parallel)
  # ==========================================
  # Mechanical lints run as script in narrator Phase 5 (mechanical-lint.sh)
  # Creative lints: linter fires 3 parallel sonnet Tasks (patterns, temporal, metaphor)
  # Linter collects violations, applies fixes, always routes to editor
  #
  # RETIRED agents (collapsed into linter + refs):
  # - lint-patterns, lint-temporal, lint-metaphor
  # RETIRED agents (now in mechanical-lint.sh):
  # - lint-forbidden-words, lint-ai-tells, lint-cadence, lint-dialogue
  # - lint-body-first, lint-litotes
  # RETIRED agents (oracle already covers):
  # - lint-factoids, lint-props

  # RETIRED: linter — lint pipeline merged into editor (linter was 21% of pipeline cost, 8 crashes)
  # Editor now runs mechanical-lint.sh + 3 parallel creative lint Tasks before stitch + holistic review
  # - name: linter
  #   model: sonnet
  #   prompt: linters/prompt.md
  #   permissions:
  #     allowedTools: [Read, Write, Edit, Bash, Glob, Grep, Task, TaskOutput]

entry_point: entry

# Two completion agents for different workflows (first-wins):
# - game-coord: New Game workflow ends after calibration
# - scribe: Write Turn workflow ends after scribe sends completion
completion_agents:
  - game-coord
  - scribe

# Session persistence: keep sessions across mesh runs (default: false)
# persistence: true

# ==========================================
# ROUTING - Phase coordinator architecture
# ==========================================

routing_fallback: core
routing_retry_max: 3

routing:
  # All agent communication uses 'message' type.
  # Messages to core/core are implicitly HITL (session pauses).
  # The system infers routing from destination.
  #
  # Phase flow: entry → game-coord|init-turn → gravity → architect → sim-planner → sim-tables → sim-voices → oracle ⇄ sim-voices → narrator → editor (lint + stitch + review) → visual (opt-in) → scribe → core
  # (Old chain v1: init-turn → fates → dramaturg → possibility → system → cast → scene-crafter → oracle → dialogue → narrator)
  # (Old chain v2: entropy-architect → cast → scene-crafter → oracle → dialogue → narrator)
  # Prep chain: direct agent-to-agent routing, no coordinator. Recovery via state-discovery.sh --next

  # Phase coordinators
  entry:
    message:
      game-coord: "Route new game or edit game request"
      init-turn: "Route player action"
      narrator: "Recovery: resume prologue (check prologue.md absence) | resume render phase"
      oracle: "Recovery: resume validation"
      scribe: "Recovery: resume compression"
      core: "Turn in progress OR message-state confusion"

  game-coord:
    message:
      calibrator: "HITL game creation"
      core: "New game calibration complete"

  # RETIRED: prologue-coord — calibrator routes directly to narrator
  # prologue-coord:
  #   message:
  #     dramaturg: "Prologue workspace ready"

  init-turn:
    message:
      gravity: "Turn workspace ready — action locked"

  gravity:
    message:
      architect: "Collision map ready — proceed with entropy generation"

  # ==========================================
  # ENTROPY + SIMULATION ROUTING (collapsed)
  # ==========================================

  architect:
    message:
      sim-planner: "Mechanical resolution complete → plan scene beats"
      core: "HITL — action-lock conflict after 3 entropy attempts"

  sim-planner:
    message:
      sim-tables: "Beat plan ready → generate tables"

  sim-tables:
    message:
      sim-voices: "Tables resolved → generate voices"
      core: "HITL — player choice point during simulation"

  sim-voices:
    message:
      oracle: "Scene simulation complete → validate continuity"

  # RETIRED: validate-coord — oracle routes directly (approved → narrator, violations → scene-crafter)
  # validate-coord:
  #   message:
  #     oracle: "Validate continuity"
  #     scene-crafter: "Fix outline violations"
  #     narrator: "Scene approved → render prose"

  # ==========================================
  # CREATIVE AGENT ROUTING
  # ==========================================

  calibrator:
    message:
      core: "HITL extraction / worldbuilder tuning | Session complete"
      narrator: "Game creation complete — render prologue"

  narrator:
    message:
      oracle: "Knowledge query"
      editor: "Prose draft complete — lint + stitch + review"
      scribe: "Prologue complete — finalize and deliver"

  oracle:
    message:
      narrator: "Continuity approved → render prose"
      sim-voices: "Continuity violations → fix scene script"

  scribe:
    message:
      core: "Turn complete — prose + rearmatter delivered"

  # RETIRED: linter routing — lint pipeline merged into editor
  # linter:
  #   message:
  #     editor: "Prose linted and fixed → adversarial review"

  # ==========================================
  # EDITOR
  # ==========================================

  editor:
    message:
      scribe: "Prose finalized → compress and complete"
      visual: "Prose finalized → generate visuals (opt-in)"

  visual:
    message:
      scribe: "Visual beats complete → compress and complete"

# ==========================================
# MANIFEST ENFORCEMENT
# ==========================================

manifest_enforcement:
  post_validation: true
  pre_validation: true
  max_retry: 2

# ==========================================
# GUARDRAILS
# ==========================================

guardrails:
  max_messages:
    limit: 10
  routing_error:
    strict: true
    warning: true
    max_retries: 2
  write_gate:
    strict: false
    warning: true
    kill_threshold: 50
  agents:
    init-turn:
      routing_error:
        strict: true
      write_gate:
        strict: true
        kill_threshold: 3
      max_messages:
        limit: 5
    architect:
      max_messages:
        limit: 15
    sim-planner:
      max_messages:
        limit: 15
    sim-tables:
      max_messages:
        limit: 25
    sim-voices:
      max_messages:
        limit: 25
    narrator:
      max_messages:
        limit: 40
    # linter retired — lint pipeline merged into editor
    editor:
      max_messages:
        limit: 20
    calibrator:
      max_messages:
        limit: 30

# ==========================================
# RELIABILITY
# ==========================================

reliability:
  heartbeat:
    warnMs: 120000
    staleMs: 300000
    deadMs: 600000

# ==========================================
# MANIFEST - File-centric I/O manifest (source of truth)
# ==========================================

manifest:
  # --- Session State ---
  - id: session.yaml
    description: Coordinator handoff state persisted across turns
    location: session
    persistent: true
    reads: [entry, game-coord, init-turn, scribe, calibrator]
    # Writers limited to 2: init-turn (full rewrite at turn start) and scribe (mark complete at turn end)
    # entry reads only for routing. game-coord and calibrator write only during game creation (via calibrator).
    writes: [init-turn, scribe, calibrator]

  # --- Turn Workspace (per-turn artifacts) ---
  - id: context.yaml
    description: Turn context seeded by coordinator, consumed by creative agents
    location: workspace
    reads: [narrator, scribe, architect, sim-planner, gravity]
    writes: [init-turn]

  - id: intent.yaml
    description: Player action — raw input, clarified intent, locked action, physical state, entropy boundaries
    location: workspace
    reads: [narrator, architect, sim-planner, gravity]
    writes: [init-turn]

  - id: collisions.yaml
    description: Collision map — pressure points between conditions, character data, seeds, bonds
    location: workspace
    reads: [architect, narrator, scribe]
    writes: [gravity]

  - id: dramaturg-notes.yaml
    description: Story analysis and outcome shapes (no weights)
    location: workspace
    reads: [narrator, scribe, sim-planner]
    writes: [architect]

  - id: entropy-tables.yaml
    description: Weighted probability tables synthesized from fates + dramaturg
    location: workspace
    reads: [architect, sim-tables]
    writes: [architect]

  - id: resolution.yaml
    description: Mechanical outcome tables, trait resolution, entropy_pool — includes all resolved entropy
    location: workspace
    reads: [narrator, scribe, sim-planner]
    writes: [architect]

  - id: threads.yaml
    description: Life thread extraction, collisions, and beat guidance — written by architect, consumed by sim-planner/narrator/scribe
    location: workspace
    reads: [sim-planner, narrator, scribe]
    writes: [architect]

  - id: sim-plan.yaml
    description: Beat plan checkpoint — psychology, frames, beat sequence, author params
    location: workspace
    reads: [sim-tables, sim-voices]
    writes: [sim-planner]

  - id: sim-progress.yaml
    description: Simulator checkpoint — phase, beat count, thread tracking
    location: workspace
    reads: [sim-tables, sim-voices]
    writes: [sim-tables, sim-voices]

  - id: entropy_tables/
    description: "Per-domain entropy table fragments — written by parallel Tasks, merged by merge-entropy-tables.sh. Includes: char-*.yaml (outcome tables), char-*-directions.yaml (direction tables), world-*.yaml, texture.yaml, threads-*.yaml, collisions.yaml"
    location: workspace
    reads: [architect]
    writes: [architect]

  - id: beat_tables/
    description: Per-beat YAML files — tables, rolls, and voice data. Audit trail.
    location: workspace
    reads: [sim-voices]
    writes: [sim-tables, sim-voices]

  - id: scene_script.yaml
    description: Beat-by-beat scene script with voices, time progression, prop tracking, pacing. Produced by sim-voices.
    location: workspace
    reads: [narrator, oracle, visual, scribe, editor]
    writes: [sim-voices]

  - id: narrator-context.yaml
    description: Pre-assembled narrator context — scene_script + briefs + author + state + collisions. Built by assemble-narrator.sh after oracle approves.
    location: workspace
    reads: [narrator, editor]
    writes: [oracle]

  - id: prose-draft.md
    description: Working prose draft — narrator writes, editor lints + fixes + reviews
    location: workspace
    reads: [narrator, editor]
    writes: [narrator, editor]

  - id: prose.md
    description: Final approved prose output for the turn
    location: workspace
    reads: [scribe, visual, narrator, editor]
    writes: [editor]

  - id: visual.yaml
    description: Multi-beat emotional visualization briefs with style variants
    location: workspace
    reads: [scribe]
    writes: [visual]

  - id: violations.yaml
    description: Mechanical lint violations — written by mechanical-lint.sh in editor pre-pass, read by creative lint Tasks for deconfliction
    location: workspace
    reads: [editor]
    writes: [narrator, editor]

  - id: story-concordance.txt
    description: Cumulative word frequency data for cross-turn overuse detection
    location: game
    persistent: true
    reads: [narrator]
    writes: [scribe]

  # RETIRED: closing.yaml — replaced by state.yaml (campaign-level, single source of truth)
  # - id: closing.yaml
  #   description: Canonical physical state at turn end for next turn continuity
  #   location: workspace
  #   reads: [init-turn, narrator]
  #   writes: [scribe]

  - id: calibration-state.yaml
    description: HITL calibration extraction progress tracker
    location: workspace
    reads: [calibrator]
    writes: [calibrator]

  # --- Game Root ---
  - id: author.yaml
    description: Author voice profile and stylistic constraints
    location: game
    persistent: true
    reads: [narrator, editor, visual, calibrator, architect, sim-planner]
    writes: [calibrator]

  - id: setting.yaml
    description: World setting, geography, tone, and genre parameters
    location: game
    persistent: true
    reads: [narrator, oracle, calibrator, architect]
    writes: [calibrator]

  - id: entities.yaml
    description: Master entity index with traits, relationships, status
    location: campaign
    persistent: true
    reads: [narrator, oracle, scribe, calibrator]
    writes: [scribe, calibrator]

  # Game-level templates — calibrator reads/writes these during game creation
  # Manifest ID = path, and path.join(location, id) must resolve correctly
  # Game and campaign share the same relative path (entities/characters/)
  # but resolve against different location roots. Validator requires unique IDs.
  # Commented out game-level entries — calibrator writes to game_path directly,
  # doesn't need manifest validation. Campaign entries are what the pipeline uses.
  #
  # - id: entities/characters/
  #   description: Game-level character templates (baseline traits, foundation)
  #   location: game
  #   persistent: true
  #   reads: [calibrator]
  #   writes: [scribe, calibrator]
  #
  # - id: entities/bonds/
  #   description: Game-level bond templates
  #   location: game
  #   persistent: true
  #   reads: [calibrator]
  #   writes: [scribe, calibrator]

  - id: entities/characters/
    description: Campaign-level character entities (enriched — NRE, sexuality, desires, conditions, episodes)
    location: campaign
    persistent: true
    reads: [init-turn, narrator, oracle, scribe, calibrator, visual, architect, sim-planner, sim-tables, sim-voices, gravity]
    writes: [scribe, calibrator]

  - id: entities/bonds/
    description: Campaign-level bond entities (enriched — conditions, episodes, dimensions)
    location: campaign
    persistent: true
    reads: [narrator, oracle, scribe, architect, sim-planner, sim-tables, sim-voices, gravity]
    writes: [scribe, calibrator]

  - id: story-corpus.txt
    description: Append-only full prose archive across all turns
    location: game
    persistent: true
    reads: []
    writes: [scribe]


  # --- Campaign State ---
  - id: arc.yaml
    description: "Story arc structure, act progression, and tension curves. Agents read via arc-read.sh (act-scoped filter). Scribe has full access for writes."
    location: campaign
    persistent: true
    autoInject: false  # Agents use arc-read.sh for filtered access. Scribe reads full file directly.
    reads: [scribe, calibrator]  # Scribe/calibrator get full access. Other agents use arc-read.sh.
    writes: [scribe, calibrator]  # Scribe writes via campaign.sh

  - id: turns/
    description: Turn workspace directories (init-turn creates new turn dirs)
    location: campaign
    reads: [init-turn, entry]
    writes: [init-turn, entry]

  - id: turns/turn-*/prose.md
    description: Prior turn finalized prose for cross-turn style consistency
    location: campaign
    reads: [editor]
    writes: [scribe]

  # RETIRED: old state.yaml — replaced by current state.yaml (campaign-level, single source of truth)
  # - id: old-state.yaml
  #   description: Campaign mechanical state — active effects, conditions, resources
  #   location: campaign
  #   persistent: true
  #   reads: [init-turn, dramaturg, system, scribe, fates]
  #   writes: [init-turn, scribe]

  - id: state.yaml
    description: Canonical scene state — location, closing positions, arc pressure, time. Replaces closing.yaml + old state.yaml.
    location: campaign
    persistent: true
    reads: [init-turn, architect, sim-planner, editor, gravity]
    writes: [scribe]

  - id: trajectories.yaml
    description: "Committed futures with timers (Chekhov's Guns). Scribe writes via campaign.sh trajectory commands."
    location: campaign
    persistent: true
    reads: [architect, gravity]
    writes: [scribe]  # Scribe writes via campaign.sh

  - id: timeline.md
    description: Canonical time tracking in markdown — day headers, turn entries, beat-level time stretches
    location: campaign
    persistent: true
    reads: [narrator, architect, editor]
    writes: [scribe]

  - id: continuity.yaml
    description: "Canonical facts, established details, and continuity anchors. Query via campaign.sh facts, not preloaded."
    location: campaign
    persistent: true
    autoInject: false  # 1600+ lines at 46 turns — too large for preload. Agents query via campaign.sh for surgical access.
    reads: [oracle, scribe, architect]  # Agents query via campaign.sh facts
    writes: [scribe]  # Scribe writes via campaign.sh

  # RETIRED: these files were never implemented by scribe
  # Uncomment and implement if needed in future
  # - id: history.md
  #   description: Narrative history log of completed turns
  #   location: campaign
  #   persistent: true
  #   reads: []
  #   writes: [scribe]

  # - id: thread.md
  #   description: Active narrative threads and unresolved hooks
  #   location: campaign
  #   persistent: true
  #   reads: []
  #   writes: [scribe]

  # - id: character-memory.yaml
  #   description: Per-character memory and relationship state
  #   location: campaign
  #   persistent: true
  #   reads: []
  #   writes: [scribe]

  # --- Templates (read-only reference) ---
  - id: arc.template.yaml
    description: Arc structure template for new campaign creation
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: entities.template.yaml
    description: Entity index template for new game creation
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: author.template.yaml
    description: Author voice profile template
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: setting.template.yaml
    description: World setting template
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: session.template.yaml
    description: Session state template for coordinator init
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: continuity.template.yaml
    description: Continuity tracking template
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

  - id: entities/characters/protagonist.template.yaml
    description: Protagonist character sheet template
    location: template
    persistent: true
    reads: [calibrator]
    writes: []

# ==========================================
# WORKSPACE
# ==========================================

workspace:
  path: ".ai/games/"
  create_on_init: false
  variables:
    source: ".ai/tx/narrative-engine-v2/session.yaml"
    mapping:
      game-id: game_id
      campaign-id: campaign_id
      N: turn
  locations:
    session: ".ai/tx/narrative-engine-v2"
    game: ".ai/games/{game-id}"
    campaign: ".ai/games/{game-id}/campaigns/{campaign-id}"
    workspace: ".ai/games/{game-id}/campaigns/{campaign-id}/turns/turn-{N}"
