# dev-full mesh
# Big-feature development: context prep → HITL criteria → implement → test → review → evaluate → ultrareview → handoff
# Combines: dev-know-build (prebuild), dev-brain (learning), dev (quality gates), dev-worktree (isolation)
# Key pattern: success criteria as independent artifact, evaluated by dedicated agent

mesh: dev-full
description: "Big-feature development with context prep, HITL success criteria, quality gates, worktree isolation, and learning capture"
brain: true



intents:
  patterns:
    - build
    - implement
    - develop
    - refactor

agents:
  - name: prebuild
    model: sonnet
    command: "/know:prebuild {feature}"
    prompt: prebuild/prompt.md
    permissions:
      allowedTools:
        - Read
        - Write
        - Glob
        - Grep
        - Bash
        - Skill

  - name: implementer
    model: sonnet
    prompt: implementer/prompt.md
    permissions:
      allowedTools:
        - Read
        - Write
        - Edit
        - Glob
        - Grep
        - Skill
        - Bash

  - name: tester
    model: sonnet
    prompt: tester/prompt.md
    permissions:
      allowedTools:
        - Read
        - Write
        - Edit
        - Glob
        - Grep
        - Bash

  - name: reviewer
    model: opus
    prompt: reviewer/prompt.md

  - name: evaluator
    model: opus
    prompt: evaluator/prompt.md
    mcpServers:
      playwright:
        command: npx
        args: ["@anthropic-ai/playwright-mcp@latest"]

  - name: ultrareview
    model: opus
    prompt: ultrareview/prompt.md

  - name: handoff
    model: sonnet
    prompt: handoff/prompt.md
    permissions:
      allowedTools:
        - Read
        - Write
        - Edit
        - Glob
        - Grep

entry_point: prebuild
completion_agents: [handoff]
continuation: true

routing:
  prebuild:
    complete:
      implementer: "Context and HITL-approved criteria ready"
    blocked:
      core: "Criteria need human validation"

  implementer:
    complete:
      tester: "Implementation ready for testing"
    blocked:
      core: "Need clarification from human"
    ask-response:
      tester: "Quick fix for test issue"
      reviewer: "Quick fix for review issue"

  tester:
    complete:
      reviewer: "Tests passing, ready for review"
    blocked:
      implementer: "Tests failing, needs full re-implementation"
    ask:
      implementer: "Minor test fix needed"
    ask-response:
      implementer: "Test feedback response"

  reviewer:
    complete:
      evaluator: "Code quality approved"
    blocked:
      implementer: "Structural issues, needs re-testing after fix"
    ask:
      implementer: "Cosmetic fix needed — naming, dead code, style"
    ask-response:
      implementer: "Review feedback response"

  evaluator:
    complete:
      ultrareview: "All criteria met - ready for final review"
    blocked:
      implementer: "Criteria gaps found, iteration needed"
      core: "Max iterations reached, human decision needed"

  ultrareview:
    complete:
      handoff: "Final review passed - generate human review steps"
    blocked:
      implementer: "Holistic issues found, revision needed"
      core: "Ship/no-ship decision needs human"

  handoff:
    complete:
      core: "Feature complete with human review steps"

workspace:
  path: ".ai/output/dev-full/{feature}/"

manifest:
  - id: context
    location: "{workspace}/context.md"
    description: "Codebase context: relevant files, patterns, constraints, integration points"
    writes: [prebuild]
    reads: [implementer, ultrareview, handoff]

  - id: criteria
    location: "{workspace}/criteria.md"
    description: "HITL-validated success criteria — the sole evaluation rubric"
    writes: [prebuild]
    reads: [implementer, tester, reviewer, evaluator, ultrareview, handoff]

  - id: working-notes
    location: "{workspace}/working-notes.md"
    description: "Implementation insights, gotchas, patterns discovered"
    writes: [implementer]
    reads: [implementer, reviewer, ultrareview, handoff]
    persistent: true

  - id: decisions
    location: "{workspace}/decisions.md"
    description: "Key decisions with rationale and trade-offs"
    writes: [implementer]
    reads: [implementer, reviewer, ultrareview, handoff]
    persistent: true

  - id: scorecard
    location: "{workspace}/scorecard.md"
    description: "Evaluator's criteria assessment scorecard"
    writes: [evaluator]
    reads: [implementer, evaluator, ultrareview, handoff]
    persistent: true

  - id: ultrareview-report
    location: "{workspace}/ultrareview.md"
    description: "Final holistic review: security, perf, integration, ship/no-ship verdict"
    writes: [ultrareview]
    reads: [implementer, ultrareview, handoff]
    persistent: true

  - id: human-review
    location: "HUMAN_REVIEW.md"
    description: "Appended human review checklist for manual verification"
    writes: [handoff]
    reads: [handoff]

lifecycle:
  pre:
    - worktree:create
  post:
    - typecheck
    - commit:auto
    - brain-update
    - worktree:cleanup

rearmatter:
  required: true
  schema:
    status: "complete | blocked | needs-review | needs-iteration"
    confidence: "1-5 scale"
    gotchas: "Issues discovered"
    learnings: "Insights for brain"

guardrails:
  max_mesh_messages:
    strict: true
    warning: true
    limit: 35
  max_invocations:
    strict: true
    warning: true
    limit: 8
  agents:
    prebuild:
      max_invocations:
        strict: true
        warning: true
        limit: 2
    evaluator:
      max_invocations:
        strict: true
        warning: true
        limit: 4
    ultrareview:
      max_invocations:
        strict: true
        warning: true
        limit: 3
    handoff:
      max_invocations:
        strict: true
        warning: true
        limit: 1

playbook_notes: |
  Big-feature mesh combining best patterns from existing dev meshes.

  Sources:
  - dev-know-build: haiku prebuild phase with /know:prebuild command interpolation
  - dev-brain: learning capture via working-notes.md + decisions.md manifests + rearmatter
  - dev/dev-review: quality-gated pipeline with rejection loops
  - dev-worktree: git worktree isolation via lifecycle hooks

  Key innovation: Success criteria as first-class artifact.
  - Derived from spec-graph + codebase exploration by prebuild (haiku)
  - HITL-validated before implementation begins (prebuild → blocked → core → resume)
  - Injected to ALL agents as shared rubric
  - Independently evaluated by dedicated evaluator (opus)
  - Separates code quality (reviewer) from acceptance criteria (evaluator)

  Evaluation loop:
  - Evaluator checks each criterion: PASS / PARTIAL / FAIL
  - Failures route back through full pipeline: implementer → tester → reviewer → evaluator
  - Max 3 iterations tracked in evaluator session context
  - After 3 failures, escalates to human (blocked → core)

  Ultrareview (final gate):
  - Reads ALL manifests: context, criteria, working-notes, decisions, scorecard
  - Reads the actual code diff/implementation
  - Holistic pass: security, performance, integration coherence, doc gaps
  - Human-facing ship/no-ship verdict with evidence
  - Code-reviewer style analysis (patterns, anti-patterns, missed edge cases)
  - Writes ultrareview.md report
  - Can block back to implementer or escalate to human

  Handoff (terminal):
  - Reads criteria, ultrareview report, scorecard, working-notes
  - Generates human review checklist: commands, manual steps, expected results
  - Appends to HUMAN_REVIEW.md in project root
  - No automated tests — just what a human needs to verify with their own eyes

  Cost profile: 4 sonnet + 3 opus = moderate-high
  No FSM needed — iteration tracking is agent-managed via session continuity.
