mesh: meet
description: "Meeting coordination agent using Google Calendar MCP - arranges and schedules meetings"
type: ephemeral
toolRestriction: mcp-only  # Sandboxed: only MCP tools, no file/bash access

intents:
  patterns:
    - schedule
    - meeting
    - calendar
    - "book time"
    - "set up meeting"
    - "arrange call"

agents:
  - name: scheduler
    model: sonnet
    prompt: scheduler/prompt.md
    mcpServers:
      google-calendar:
        command: npx
        args:
          - "@cocal/google-calendar-mcp"

entry_point: scheduler
completion_agent: scheduler

routing:
  scheduler:
    complete:
      core: "Meeting scheduled successfully"
    blocked:
      core: "Need clarification or unable to schedule"

rearmatter:
  enabled: true
  fields:
    - status
    - meeting_time
    - attendees
