name: dev-mid
description: "Handles standard features and moderate complexity: implementing features from specs, refactoring components, adding tests, integrating APIs, and moderate architectural changes. Use for typical development work."
version: 1.0.0
model: sonnet

agents:
  - id: worker
    role: Mid-Level Developer
    model: sonnet
    prompt: worker.md
    initial: true

routing:
  complete:
    to: core/core
  error:
    to: core/core
  blocked:
    to: core/core
